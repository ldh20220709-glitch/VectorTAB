<script>
/* ===== 离线后端：曲目结构和图片都放 localStorage，file:// 下可用 ===== */
(function(){
  var K='gs2.', IMG={}, SONGS={};
  function rd(k,d){ try{ var v=localStorage.getItem(K+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  var GONE={};
  try{ IMG=rd('imgs',{}); SONGS=rd('songs',{}); GONE=rd('gone',{}); }catch(e){}
  /* 单曲离线包把数据直接挂在页面上，不经 localStorage——
     file:// 下存储可能被限制或配额不足，静默失败就会打开一片空白 */
  if(window.__SEED){
    try{
      var sd=window.__SEED;
      var pack = sd.songs || (sd.id ? (function(){var o={};o[sd.id]=sd.song;return o;})() : {});
      window.__SEEDN = Object.keys(pack).length;
      window.__SEEDIDS = Object.keys(pack);        /* 给曲库页标注哪些是随文件带来的 */
      var si=sd.imgs||{};
      for(var sk in si) IMG[sk]=si[sk];            /* 图片先并进来，下面要靠它判断 */
      /* 本机存过同名曲目时，以前一律让本机的赢，结果是：重新生成过的文件（图片内容变了、
         内容哈希算出来的图片 id 跟着变）打开后，旧记录指向的图片 id 已经不存在 —— 整页没图，白屏。
         现在只在「本机那份的图片还找得着」时才保留它（保住用户自己的改动），否则用文件里带的。 */
      for(var sid in pack){
        if(GONE[sid]) continue;
        var cur=SONGS[sid], live=false;
        try{
          live = !!cur && !!(cur.pages||[]).length
                 && (cur.pages||[]).every(function(pg){ return !!IMG[pg.a]; });
        }catch(e){ live=false; }
        if(!live) SONGS[sid]=pack[sid];
      }
    }catch(e){}
  }
  function wr(k,v){ localStorage.setItem(K+k, JSON.stringify(v)); }   /* 满了会抛，向上传 */
  function nid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  window.__OFFLINE=true;
  window.__BLOB=function(id){ return IMG[id]||''; };
  /* 只统计真正写进 localStorage 的部分。随文件带来的内置曲目不占配额，
     早先把它们也算进去，会报出一个根本不存在的「快满了」。 */
  window.__USAGE=function(){
    var n=0; try{ n=(localStorage.getItem(K+'imgs')||'').length
                  + (localStorage.getItem(K+'songs')||'').length; }catch(e){}
    return n; };
  window.__SEEDN=0;
  window.__WIPE=function(){
    try{ localStorage.removeItem(K+'imgs'); localStorage.removeItem(K+'songs');
         localStorage.removeItem(K+'gone'); }catch(e){}
  };
  window.__EXPORT=function(){ return {v:1, songs:SONGS, imgs:IMG}; };
  window.__IMPORT=function(o){
    if(!o||!o.songs) throw new Error('不是滚谱台的备份文件');
    for(var k in o.songs) SONGS[k]=o.songs[k];
    for(var j in (o.imgs||{})) IMG[j]=o.imgs[j];
    wr('songs',SONGS); wr('imgs',IMG);
  };

  var db={ collection:function(){ return {
    get:function(){ return Promise.resolve({docs:Object.keys(SONGS).map(function(id){
      return {id:id, exists:true, data:function(){ return SONGS[id]; }}; })}); },
    doc:function(id){ id=id||nid('s'); return {
      id:id,
      set:function(v){ SONGS[id]=v; try{ wr('songs',SONGS); }catch(e){
          return Promise.reject(new Error('本地存储满了，先导出备份再删掉用不上的曲目')); }
        return Promise.resolve(); },
      delete:function(){ delete SONGS[id]; GONE[id]=1;      /* 记下来，免得内置曲目刷新又冒出来 */
        try{ wr('songs',SONGS); wr('gone',GONE); }catch(e){} return Promise.resolve(); },
      get:function(){ return Promise.resolve({id:id, exists:!!SONGS[id], data:function(){ return SONGS[id]; }}); }
    }; } }; } };

  var assets={
    upload:function(f){ return new Promise(function(ok,no){
      var r=new FileReader();
      r.onload=function(){
        var id=nid('i'); IMG[id]=r.result;
        try{ wr('imgs',IMG); }catch(e){ delete IMG[id];
          no(new Error('本地存储满了（约 5 MB 上限），先「导出备份」再删掉用不上的曲目')); return; }
        ok({id:id, url:r.result});
      };
      r.onerror=function(){ no(new Error('读取图片失败')); };
      r.readAsDataURL(f);
    }); },
    delete:function(id){ delete IMG[id]; try{ wr('imgs',IMG); }catch(e){} return Promise.resolve(); }
  };
  /* 合并而不是覆盖：这份 shim 也会跑在 Artifact 页面里，别踩掉宿主自己挂的东西 */
  var prev = window.claude || {};
  var merged = {}; for(var pk in prev) merged[pk]=prev[pk];
  merged.use = function(n){
    return Promise.resolve(n==='db'?db : n==='assets'?assets : null); };
  window.claude = merged;
})();
</script>
<title>吉他弹唱动态谱</title>
<style>
:root{
  --ground:#EFEBE3; --panel:#FDFCFA; --ink:#1C1A17; --muted:#6E665C; --line:#D9D2C5;
  --accent:#C06A22; --accent-ink:#FFF7EE; --rail:#E0D8CA; --paper:#FFFFFF;
  --accent-soft:rgba(192,106,34,.22); --scrim:rgba(239,235,227,.80);
  --cue:#D62828; --cue-soft:rgba(214,40,40,.065); --cue-glow:rgba(214,40,40,.42);
  --ok:#2F7D56;
  --shadow:0 1px 2px rgba(28,26,23,.10),0 8px 28px rgba(28,26,23,.10);
  /* 纯系统字体栈，零外部请求 */
  --num:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106; --rail:#241F18; --ok:#56B183;
  --accent-soft:rgba(231,155,64,.26); --scrim:rgba(17,15,12,.82);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106; --rail:#241F18; --ok:#56B183;
  --accent-soft:rgba(231,155,64,.26); --scrim:rgba(17,15,12,.82);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--cjk);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));
     background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:6}
/* 从目录页点进来时才出现（链接带 ?lib=1）。
   单独发给别人的文件没有这个参数，看不到这个键，也就不会点出 404。 */
#back{display:none;align-items:center;font-family:var(--cjk);font-size:12px;font-weight:600;
      color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;
      padding:5px 9px;margin-right:2px;white-space:nowrap}
#back:hover{color:var(--ink);border-color:var(--accent)}
#back:not([hidden]){display:inline-flex}
#brand{font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap;color:var(--muted)}
#songname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songname:not(:empty)::before{content:"/";color:var(--line);margin-right:9px;font-weight:400}
#songname b{font-family:var(--num);font-size:12px;font-weight:700;color:var(--accent);
     border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin-left:7px}
#bar .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--rail);border-radius:8px;padding:2px}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;
     font-family:var(--cjk);font-size:12px;font-weight:600;padding:5px 11px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon,.sm{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
     font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.06em;padding:6px 10px;cursor:pointer}
.icon:hover,.sm:hover{color:var(--ink);border-color:var(--accent)}
.sm[aria-pressed="true"],.icon[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm.warn:hover{color:var(--cue);border-color:var(--cue)}
.cjk{font-family:var(--cjk);letter-spacing:0}
input[type=text],input[type=number]{font-family:var(--cjk);font-size:13px;color:var(--ink);background:var(--panel);
     border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}

.view{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 40px}
.wrap{max-width:860px;margin:0 auto}

/* ---------- 曲库 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
      display:flex;align-items:center;gap:12px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--num);font-size:13px;color:var(--muted);
  min-width:26px;text-align:right;flex:0 0 auto}
.card .nm{flex:1;min-width:0;font-size:17px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{cursor:pointer}
#q{font-family:var(--cjk);font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;flex:1 1 220px;
  min-width:0;-webkit-appearance:none;appearance:none}
#q:focus{outline:none;border-color:var(--accent)}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font-size:17px;font-weight:600;margin-bottom:3px}
.card .t span{font-family:var(--num);font-size:12px;color:var(--muted)}
.card .sig{font-family:var(--num);font-size:13px;font-weight:700;color:var(--accent);
      border:1px solid var(--accent);border-radius:5px;padding:2px 7px;flex:0 0 auto}
.card .mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.card .mv button{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);
     border-radius:5px;width:28px;height:17px;line-height:1;font-size:10px;cursor:pointer;padding:0}
.card .mv button:hover:not(:disabled){color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.card .mv button:disabled{opacity:.3;cursor:default}
.libhd{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.libhd .sp{flex:1 1 auto}
.ordtip{font-size:12px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
.ordtip b{color:var(--accent);font-weight:600}
.libhd b{font-size:18px;font-weight:600}
.libhd span{font-family:var(--num);font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:36px 10px}
#warn{background:var(--cue);color:#fff;font-size:12px;padding:8px 14px;line-height:1.5}
#warn.info{background:var(--rail);color:var(--muted)}

.row2{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
/* ---------- 演奏（与单曲版同一套） ---------- */
#playView{display:flex;flex-direction:column;padding:0;overflow:hidden}
#wrapP{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;cursor:pointer;
       -webkit-user-select:none;user-select:none}
#stage::-webkit-scrollbar{display:none}
#paper{position:relative;width:var(--pw,100%);max-width:1040px;margin:0 auto;background:var(--paper);
       box-shadow:var(--shadow);padding:0 14px 8px;
       display:flex;flex-wrap:wrap;align-items:flex-start;
       /* 行间留白，列间必须是 0 —— 同一行里相邻的半行要无缝接上 */
       column-gap:0;row-gap:18px;padding-top:12px}
/* 段落不再插文字到谱面中间——那会把一行音乐切断。
   改成谱条左缘一道竖条，零横向占位；段落名在底部读数里实时显示。 */
.prow.secstart::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
     background:var(--accent);border-radius:2px;z-index:4;pointer-events:none}
.prow{position:relative;flex:0 0 auto;width:var(--w)}
.ptitle{flex:0 0 100%;position:relative;background-repeat:no-repeat;margin-bottom:2px}
.ptxt{flex:0 0 100%;display:flex;align-items:baseline;gap:10px;padding:10px 2px 4px;
     border-bottom:1px solid var(--line);margin-bottom:4px}
.ptxt b{font-size:19px;font-weight:600;color:var(--ink)}
.ptxt span{font-family:var(--num);font-size:12px;color:var(--muted)}
.strip{position:relative;width:100%;background-repeat:no-repeat;max-width:100%}
/* 结尾只要把「谱终」露出来就行，不再撑出一屏空白把末行顶到页顶。
   原来 padding-bottom:52vh 是为了让最后一行也能滚到屏幕上方，
   结果弹完最后一小节谱面还在往上爬，底下全是空的。
   follow() 本来就会把 want 夹在 scrollHeight-clientHeight 以内，
   把这截空白去掉，滚动自然停在「末行 + 谱终」都看得见的位置。 */
#eof{padding:26px 0 28px;text-align:center;font-family:var(--num);font-size:13px;letter-spacing:.16em;
     color:var(--muted);background:var(--ground)}
#stage.ribbon{overflow:hidden}
#stage.ribbon #paper{position:absolute;top:50%;left:0;width:auto;max-width:none;display:flex;
     flex-wrap:nowrap;row-gap:0;align-items:flex-start;padding:0;box-shadow:none;will-change:transform}
#stage.ribbon .prow{flex:0 0 auto;border-right:1px solid #E6E1D6}
#stage.ribbon .strip{width:auto;max-width:none}
#stage.ribbon #band,#stage.ribbon #cue{display:none!important}
#stage.ribbon #eof{display:none}
#line{position:absolute;top:0;bottom:0;left:33%;width:3px;margin-left:-1.5px;background:var(--cue);
      box-shadow:0 0 12px var(--cue-glow);z-index:4;pointer-events:none;display:none}
#stage.ribbon ~ #line{display:block}
#band{position:absolute;left:0;width:100%;background:var(--cue-soft);pointer-events:none;display:none;z-index:1}
#cue{position:absolute;left:0;top:0;width:3px;margin-left:-1.5px;background:var(--cue);border-radius:2px;
     box-shadow:0 0 9px var(--cue-glow);pointer-events:none;display:none;z-index:3;
     will-change:transform}
#cue::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
     border:5px solid transparent;border-top:8px solid var(--cue)}
/* 跳转预告：整页模式下反复要往回跳，提前约一小节在目标位置闪一个箭头 */
#jump{position:absolute;width:3px;margin-left:-1.5px;background:var(--cue);border-radius:2px;
     z-index:5;pointer-events:none;display:none;box-shadow:0 0 10px var(--cue-glow);
     animation:jb .55s steps(1,end) infinite}
#jump::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
     border:9px solid transparent;border-top:14px solid var(--cue)}
/* 目标常常滚出屏幕，所以同时在游标旁边贴一个提示——眼睛正看着那儿 */
#jwarn{position:absolute;z-index:6;pointer-events:none;display:none;transform:translateX(-50%);
     background:var(--cue);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;
     padding:3px 10px;border-radius:999px;box-shadow:0 3px 12px var(--cue-glow);
     animation:jb .55s steps(1,end) infinite}
#jwarn::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
     border:5px solid transparent;border-top:7px solid var(--cue)}
@keyframes jb{0%,49%{opacity:1}50%,100%{opacity:.12}}
@media (prefers-reduced-motion:reduce){#jump{animation:none;opacity:1}}
#dock{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px 14px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);

#readout{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted);
         white-space:nowrap;display:flex;align-items:baseline;gap:8px;flex:1 1 auto}

#beat{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--accent)}

#spdwrap{position:relative;flex:0 0 auto}
#spdpop{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);z-index:9;width:96px;
        background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
        padding:11px 9px 9px;display:flex;flex-direction:column;align-items:center;gap:6px}
#spdpop .hd{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1;color:var(--ink)}
#spdpop .unit{font-size:11px;color:var(--muted);margin-top:-3px}
#spdpop .sub{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}

      accent-color:var(--accent);transform:translate(-50%,-50%) rotate(-90deg)}

#count span{font-family:var(--num);font-size:clamp(72px,22vw,170px);font-weight:700;color:var(--accent);
            font-variant-numeric:tabular-nums;line-height:1}

@media (max-width:470px){ #dock{gap:8px 9px;padding-inline:10px} .sec{padding-inline:10px} }
@media (prefers-reduced-motion:reduce){ #dock,#flash{transition:none} }

<script>
(function(){
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const blobUrl=id=> window.__BLOB ? window.__BLOB(id) : '/_blob/'+id;
/* 每种拍号：[一小节几个单位, 几个单位算一个主拍]
   4/4 单位=四分音符，主拍就是它；6/8 单位=八分音符，3 个才算一个主拍（附点四分） */
const SIGS={'4/4':[4,1],'3/4':[3,1],'2/4':[2,1],'2/2':[2,1],
            '6/8':[6,3],'9/8':[9,3],'12/8':[12,3],'3/8':[3,3]};
const sigOf=s=>SIGS[(s&&s.sig)||'4/4']||SIGS['4/4'];
const sigSet=s=>!!(s&&s.sig);

/* ================= 能力 ================= */
let DB=null, AS=null, DL=null, ready=false;
async function boot(){
  try{ DB = (await window.claude?.use?.('db')) || null; }catch(e){}
  try{ AS = (await window.claude?.use?.('assets')) || null; }catch(e){}
  try{ DL = (await window.claude?.use?.('downloads')) || null; }catch(e){}
  ready=true;
  if(!DB || !AS){
    $('warn').hidden=false;
    $('warn').textContent = !AS
      ? '这个视图不能上传图片（需要编辑权限）。你仍然可以打开已有曲目演奏。'
      : '这个视图连不上存储，改动不会保存。';
  }
  await loadLib();
  if(window.__BOOT){                      /* 单曲离线包：直接打开演奏 */
    const s=LIB.find(x=>x.id===window.__BOOT);
    if(s){ open_(s); show('play'); }
    else {                                /* 绝不留一片空白给用户 */
      const wv=$('warn'); wv.hidden=false; wv.className='';
      wv.textContent='这份单曲文件里的谱子数据没能载入——文件可能不完整。'
        +'需要重新生成一份。';
    }
  }
}

/* ================= 数据 ================= */
let LIB=[], LIB0=[], S=null;          /* S = 当前曲目，LIB0 = 没排过的原始顺序 */

/* ================= 曲目顺序 =================
   纯静态页面没有后端，跨终端只能这么办，三层叠起来用：
     1. localStorage —— 本机立刻生效，file:// 也能用，但只认这一台设备这一个浏览器。
     2. order.json  —— 和页面放同一个目录，走 http(s) 时开页就拉。
        推一个几百字节的 json 到仓库，所有设备下次打开就同步了，不用重新生成 6MB 的 HTML。
     3. 顺序码      —— 一串可以复制粘贴的文本，用来手动把顺序带到另一台设备（离线也行）。
   谁新用谁（比 ts），本机改动永远立刻生效，不会被云端悄悄盖掉。*/
const OKEY='gs2.order';
let ORD=null, ORDTS=0, ordNote=false;

const sid6 = id => String(id||'').replace(/^sg-/,'').slice(0,6);

function ordRead(){
  try{ const o=JSON.parse(localStorage.getItem(OKEY)||'null');
       if(o && Array.isArray(o.ids)){ ORD=o.ids; ORDTS=o.ts||0; } }catch(e){}
}
function ordWrite(){
  ORDTS=Date.now();
  try{ localStorage.setItem(OKEY, JSON.stringify({v:1, ts:ORDTS, ids:ORD})); }catch(e){}
}
/* 顺序码：每首取 id 的前 6 位十六进制，拼起来。31 首≈186 个字符，够短，能一条消息发走。 */
function ordCode(){ return 'GS1' + (ORD||LIB0.map(x=>x.id)).map(sid6).join(''); }
function ordFromCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(!/^GS1[0-9a-f]+$/i.test(code) || (code.length-3)%6) return null;
  const want=code.slice(3).toLowerCase().match(/.{6}/g)||[];
  const by={}; LIB0.forEach(x=>{ by[sid6(x.id)]=x.id; });
  const ids=want.map(k=>by[k]).filter(Boolean);
  return ids.length ? ids : null;
}
/* order.json 形如 {"v":1,"ts":1730000000000,"ids":["sg-...","sg-..."]} */
async function ordFetch(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('order.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const o=await r.json();
    if(!o || !Array.isArray(o.ids)) return;
    /* 钳住未来时间：order.json 里写了个未来的 ts（手抖或时钟歪了）会永远压过本机，
       用户在这台设备上调的顺序一刷新就被悄悄吃掉。 */
    const rt=Math.min(Number(o.ts)||0, Date.now());
    if(rt <= ORDTS) return;
    ORD=o.ids; ORDTS=rt; ordWrite();
    ordNote=true;                      /* 不要悄悄换，渲染时提示一行 */
  }catch(e){}
}
/* 把 LIB0 按 ORD 排。ORD 里没有的（新加的曲子）按原顺序排在后面，不会丢。 */
function applyOrd(){
  if(!ORD || !ORD.length){ LIB=LIB0.slice(); return; }
  const pos={}; ORD.forEach((id,i)=>{ pos[id]=i; });
  const known=[], rest=[];
  LIB0.forEach(x=> (pos[x.id]!=null ? known : rest).push(x));
  known.sort((a,b)=>pos[a.id]-pos[b.id]);
  LIB=known.concat(rest);
}
function moveSong(id, dir){
  const i=LIB.findIndex(x=>x.id===id), j=i+dir;
  if(i<0 || j<0 || j>=LIB.length) return;
  const t=LIB[i]; LIB[i]=LIB[j]; LIB[j]=t;
  ORD=LIB.map(x=>x.id); ordWrite(); ordNote=false; renderLib();
}
const blank=()=>({title:'未命名', key:'1 = C', sig:null, bpm:68, pages:[], rows:[], seq:[]});

async function loadLib(){
  LIB0=[];
  if(DB){
    try{
      const q=await DB.collection('songs').get();
      LIB0=q.docs.map(d=>Object.assign({id:d.id}, d.data()));
    }catch(e){ console.warn(e); }
  }
  ordRead();
  const h=(location.hash||'').match(/[#&]o=(GS1[0-9a-f]+)/i);   /* 链接里带顺序码也认 */
  if(h){ const ids=ordFromCode(h[1]); if(ids){ ORD=ids; ordWrite(); } }
  applyOrd(); renderLib();
  ordFetch().then(()=>{ applyOrd(); renderLib(); });
}
let saveT=0;
function save(now){
  if(!DB||!S) return;
  clearTimeout(saveT);
  const go=async()=>{ try{
      const {id,...body}=S; await DB.collection('songs').doc(id).set(body);
    }catch(e){ console.warn('save',e); } };
  now? go() : saveT=setTimeout(go, 700);
}

/* ================= 曲库 ================= */
function renderLib(){
  const L=$('libList'); L.textContent='';
  const kw=($('q').value||'').trim().toLowerCase();
  const list = kw ? LIB.filter(x=>(x.title||'').toLowerCase().includes(kw)) : LIB;
  const hd=el('div','libhd');
  hd.appendChild(el('b',null,'曲目'));
  hd.appendChild(el('span',null, kw ? list.length+' / '+LIB.length+' 首'
                                    : '共 '+LIB.length+' 首'));
  hd.appendChild(el('span','sp',''));
  const bCode=el('button','sm cjk','顺序码');
  bCode.title='把当前顺序导出成一段文本，或粘贴别处来的顺序';
  bCode.onclick=ordDialog;
  hd.appendChild(bCode);
  if(ORD && ORD.length){
    const bRst=el('button','sm warn cjk','默认顺序');
    bRst.onclick=()=>{ if(!confirm('恢复成文件自带的顺序？')) return;
      ORD=null; try{ localStorage.removeItem(OKEY); }catch(e){} ORDTS=0;
      applyOrd(); renderLib(); };
    hd.appendChild(bRst);
  }
  L.appendChild(hd);
  if(ordNote){
    const t=el('div','ordtip');
    t.innerHTML='曲目顺序已按 <b>order.json</b> 更新。在这里调一下 ▲▼ 就会以本机为准。';
    L.appendChild(t);
  }
  if(kw){
    const t=el('div','ordtip');
    t.innerHTML='搜索时不能调顺序——<b>清空搜索框</b>再用 ▲▼。';
    L.appendChild(t);
  }
  if(!list.length){
    const e=el('div','empty');
    e.textContent = kw ? '没有叫「'+$('q').value.trim()+'」的曲子。' : '这个文件里还没有曲目。';
    L.appendChild(e); return;
  }
  /* 序号按曲库当前顺序给，搜索时不重排，方便和完整列表对上号 */
  list.forEach(s=>{
    const i=LIB.indexOf(s);
    const c=el('div','card');
    c.appendChild(el('span','no',String(i+1)));
    c.appendChild(el('b','nm',s.title||'未命名'));
    const mv=el('div','mv');
    const up=el('button',null,'▲'), dn=el('button',null,'▼');
    up.type=dn.type='button';
    up.setAttribute('aria-label','上移'); dn.setAttribute('aria-label','下移');
    up.disabled = !!kw || i<=0;
    dn.disabled = !!kw || i>=LIB.length-1;
    up.onclick=e=>{ e.stopPropagation(); moveSong(s.id,-1); };
    dn.onclick=e=>{ e.stopPropagation(); moveSong(s.id, 1); };
    mv.append(up,dn); c.appendChild(mv);
    const b=el('button','sm go cjk','演奏');
    b.onclick=e=>{ e.stopPropagation(); open_(s); show('play'); };
    c.appendChild(b);
    c.onclick=()=>{ open_(s); show('play'); };
    L.appendChild(c);
  });
}

/* 顺序码：导出一段能复制走的文本，或粘一段进来。
   跨设备没有后端可用，这是唯一离线也成立的办法。 */
function ordDialog(){
  const code=ordCode();
  const paste=prompt(
    '当前顺序码（复制走，在别的设备上再粘回来）：\n\n'+code+
    '\n\n要应用别处来的顺序，就把那串码粘在这里再按确定；直接按取消则什么都不做。',
    code);
  if(paste==null) return;
  if(paste.trim()===code) return;
  const ids=ordFromCode(paste);
  if(!ids){ alert('这串码不对，或者里面的曲子这个文件里没有。'); return; }
  ORD=ids; ordWrite(); applyOrd(); renderLib();
  alert('顺序已套用（'+ids.length+' 首）。');
}
function open_(s){ S=s;
  $('songname').textContent=s.title||'';
  if(s.sig) $('songname').appendChild(el('b',null,s.sig));
}

/* ================= 视图切换 ================= */
function show(v){
  $('libView').hidden = v!=='lib';
  $('playView').hidden= v!=='play';
  $('tabLib').setAttribute('aria-selected',String(v==='lib'));
  $('tabPlay').setAttribute('aria-selected',String(v==='play'));
  if(v==='lib'){ renderLib(); $('songname').textContent=''; }
  if(v==='play'){ buildPlay(); }
  else P.stop();
}
$('tabLib').onclick =()=>show('lib');
$('q').oninput=()=>renderLib();
$('tabPlay').onclick=()=>{ if(S) show('play'); };

/* ================= 演奏 ================= */
const stage=$('stage'), paper=$('paper'), dock=$('dock'), pico=$('pico'),
      sb=$('seek'), fill=$('fill'), knob=$('knob'), durv=$('durv'),
      rem=$('rem'), where=$('where'), beatv=$('beat'), count=$('count'), flash=$('flash'),
      spv=$('spv'), popv=$('popv'), popt=$('popt'), spdpop=$('spdpop'), lineEl=$('line');
let band=null, cue=null, jump=null, jwarn=null;
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;

let PL=[], CUM=[0], TOT=0, DOWN={}, CLK={}, INBAR=[], LAB=[], prows=[], psts=[];
let GRP=1;                      /* 几个单位算一个主拍：4/4 是 1，6/8 是 3 */
let subdiv=false;               /* 节拍器是否连细分一起响 */
let bpm=68, pos=0, playing=false, last=0, raf=0, written=-1, lock=null, cur=-1, sy=0,
    ribbon=false, drag=false, metro=false;
let acx=null, aT=0, aPos=0, nb=0, pend=[], armed=false;

function lsg(k){ try{ return localStorage.getItem('gs.'+k); }catch(e){ return null; } }
function lss(k,v){ try{ localStorage.setItem('gs.'+k,v); }catch(e){} }
ribbon = lsg('ribbon')==='1'; metro = lsg('metro')==='1'; subdiv = lsg('subdiv')==='1';
/* 排法跟着显示模式走：
   跑马灯 = 展开反复，一条带子只往前走；
   整页   = 谱面只铺一遍（和印刷谱一致），反复时游标跳回原位，能看出整首的结构。 */

function buildPlay(){
  P.stop();
  PL=[]; paper.textContent=''; LAB=[];
  if(!S || !S.seq.length){ paper.appendChild(el('div','empty','这首还没有谱面内容。')); return; }
  if(!sigSet(S)) setTimeout(()=>say('拍号还没设，先按 4/4 走'),500);
  let curSec='';
  const items=[];
  S.seq.forEach((it,idx)=>{
    const r=S.rows[it.r]; if(!r) return;
    const pg=S.pages[r.p]; if(!pg) return;
    const first=(idx===0);
    /* cut0 = 从第几根小节线起奏（跳房子要从行中间接上），cut = 到第几根为止 */
    const b0 = it.cut0!=null ? Math.max(0,Math.min(it.cut0, r.bb.length-1)) : 0;
    const nbars = it.cut!=null ? Math.min(it.cut, r.bb.length) : r.bb.length;
    if(nbars<=b0) return;
    /* 紧裁到首尾小节线：左右两侧的空白（谱号、行尾余量）会让游标在接缝处
       凭空走一段，跑马灯模式下就是「突然跳一下」。留 2px 只为不切掉小节线本身。
       唯独第一条保留左边空白——那儿有谱号和调号，齐根切掉看着别扭。 */
    const sx0 = first ? 0 : Math.max(0, r.bl[b0]-2);
    const cutX = Math.min(pg.w, r.bl[nbars]+2);
    const cw = cutX - sx0;
    const ch = r.y1-r.y0;
    const bb = r.bb.slice(b0,nbars);
    const gx=[];
    for(let i=b0;i<nbars;i++){
      /* 行首第一小节从 m0 起（谱号/TAB字母/拍号那截不占拍，游标别从那儿走）；
         从行中途接入(cut0>0)时没有谱号，照常用小节线 */
      const a=(i===b0 && b0===0 && r.m0!=null) ? r.m0 : r.bl[i], b=r.bl[i+1], n=r.bb[i];
      for(let j=0;j<n;j++) gx.push((a+(b-a)*j/n - sx0)/cw*100); }
    gx.push((r.bl[nbars]-sx0)/cw*100);
    items.push({it, r, pg, cw, ch, sx0, gx, bb});
  });
  if(!items.length){ paper.appendChild(el('div','empty','这首还没有谱面内容。')); return; }

  const mkStrip=(r,pg,cw,ch,sx0,maxCw)=>{
    const row=el('div','prow'), st=el('div','strip');
    row.style.setProperty('--w',(cw/maxCw*100)+'%');   /* 宽度挂在 prow 上，百分比才有参照 */
    st.style.aspectRatio = cw+'/'+ch;
    st.style.backgroundImage='url("'+blobUrl(pg.a)+'")';
    st.style.backgroundSize=(pg.w/cw*100)+'% auto';
    st.style.backgroundPosition=(pg.w>cw ? sx0/(pg.w-cw)*100 : 0)+'% '
                               +(pg.h>ch ? r.y0/(pg.h-ch)*100 : 0)+'%';
    row.appendChild(st); paper.appendChild(row);
    return row;
  };

  if(ribbon){
    /* 展开：一个演奏项一条谱，只往前走 */
    let maxCw=1; items.forEach(o=>{ if(o.cw>maxCw) maxCw=o.cw; });
    items.forEach((o,k)=>{
      const {it,r,pg,cw,ch,sx0,gx,bb}=o;
      const row=mkStrip(r,pg,cw,ch,sx0,maxCw);
      if(it.sec){ curSec=it.sec; row.classList.add('secstart'); row.title=it.sec; }
      PL.push({beats:bb.reduce((a,b)=>a+b,0), bars:bb, gx, row:k,
               sr:it.r, b0:(it.cut0!=null?it.cut0:0),
               b1:(it.cut!=null?it.cut:r.bb.length),
               cw, ch, sc:(r.sy0+r.sy1)/2 - r.y0});
      LAB.push(curSec);
    });
  } else {
    /* 原图上的标题区 = 第一页顶端到第一行谱之间那一块，直接裁出来用，原汁原味 */
    const p0=S.pages[0];
    const top0=S.rows.filter(x=>x.p===0).reduce((m,x)=>Math.min(m,x.y0), 1e9);
    if(p0 && top0>24 && top0<p0.h){
      const tt=el('div','ptitle');
      tt.style.aspectRatio = p0.w+'/'+top0;
      tt.style.backgroundImage='url("'+blobUrl(p0.a)+'")';
      tt.style.backgroundSize='100% auto';
      tt.style.backgroundPosition='0% 0%';
      paper.appendChild(tt);
    } else {
      const tt=el('div','ptxt');
      tt.appendChild(el('b',null,S.title||'未命名'));
      tt.appendChild(el('span',null,[S.key,S.sig,(S.bpm||68)+' BPM'].filter(Boolean).join('   ')));
      paper.appendChild(tt);
    }
    /* 回跳：谱面只铺一遍（和印刷谱一致），反复时游标跳回原位 */
    const used=[...new Set(S.seq.map(i=>i.r))].filter(i=>S.rows[i]).sort((a,b)=>
      (S.rows[a].p-S.rows[b].p)||(S.rows[a].y0-S.rows[b].y0));
    const geo={}; let maxCw=1;
    /* 整页模式不裁左右：每行独占一行，没有接缝要对付，
       保留原版面的左右留白，各行谱表才会上下对齐。
       （裁切是为跑马灯服务的——那里谱条首尾相接，留白会让游标空走。） */
    used.forEach((ri,k)=>{
      const r=S.rows[ri], pg=S.pages[r.p];
      geo[ri]={r,pg,sx0:0,cutX:pg.w,cw:pg.w,ch:r.y1-r.y0,idx:k};
      if(pg.w>maxCw) maxCw=pg.w;
    });
    used.forEach(ri=>{ const g=geo[ri]; mkStrip(g.r,g.pg,g.cw,g.ch,g.sx0,maxCw); });
    items.forEach(o=>{
      const {it,r,bb}=o, g=geo[it.r];
      const b0=it.cut0!=null?Math.max(0,Math.min(it.cut0,r.bb.length-1)):0;
      const nb=it.cut!=null?Math.min(it.cut,r.bb.length):r.bb.length;
      const gx=[];
      for(let i=b0;i<nb;i++){
        const a=(i===b0 && b0===0 && r.m0!=null) ? r.m0 : r.bl[i], b2=r.bl[i+1], n=r.bb[i];
        for(let j=0;j<n;j++) gx.push((a+(b2-a)*j/n - g.sx0)/g.cw*100); }
      gx.push((r.bl[nb]-g.sx0)/g.cw*100);
      if(it.sec) curSec=it.sec;
      PL.push({beats:bb.reduce((a,b2)=>a+b2,0), bars:bb, gx, row:g.idx,
               sr:it.r, b0:b0, b1:nb,
               cw:g.cw, ch:g.ch, sc:(r.sy0+r.sy1)/2 - r.y0});
      LAB.push(curSec);
    });
  }
  band=el('div'); band.id='band'; cue=el('div'); cue.id='cue';
  jump=el('div'); jump.id='jump';
  jwarn=el('div'); jwarn.id='jwarn';
  paper.append(band,cue,jump,jwarn);
  prows=[...paper.querySelectorAll('.prow')];
  psts=prows.map(r=>r.querySelector('.strip'));
  CUM=[0]; PL.forEach(m=>CUM.push(CUM[CUM.length-1]+m.beats));
  TOT=CUM[CUM.length-1]||1;
  GRP=sigOf(S)[1];
  DOWN={}; CLK={}; INBAR=[];
  PL.forEach((m,i)=>{ let o=CUM[i];
    m.bars.forEach(n=>{
      DOWN[o]=1;
      const main=Math.max(1,Math.ceil(n/GRP));
      for(let j=0;j<n;j++){
        if(j%GRP===0) CLK[o+j]=1;                 /* 主拍 */
        INBAR[o+j]=(Math.floor(j/GRP)+1)+'/'+main;
      }
      o+=n; }); });
  [...sb.querySelectorAll('.tk')].forEach(n=>n.remove());
  PL.forEach((m,i)=>{ if(!i) return;
    const t=el('div','tk'+(LAB[i]!==LAB[i-1]?' hd':'')); t.style.left=(CUM[i]/TOT*100)+'%'; sb.appendChild(t); });
  bpm = S.bpm||68; setBpm(bpm); setMetro(metro); setSub(subdiv); applyMode();
  fit(); seek(0);
}

function dur(){ return TOT/(bpm*GRP)*60; }
function fit(){ const w=stage.clientWidth; paper.style.setProperty('--pw', w>900?'76%':(w>640?'90%':'100%')); }
function at(u){ u=Math.max(0,Math.min(TOT,u));
  let i=PL.length-1;
  for(let k=0;k<PL.length;k++) if(u<CUM[k+1]){ i=k; break; }
  return {i, b:u-CUM[i]}; }

function paint(){
  if(!PL.length) return;
  const a=at(pos), m=PL[a.i], r=prows[m.row];
  if(a.i!==cur){ const lb=LAB[a.i]; if(lb && lb!==LAB[cur]) say(lb); cur=a.i; }
  where.textContent=(LAB[a.i]||'')+' · 第'+(a.i+1)+'/'+PL.length+'段';
  rem.textContent=mmss((TOT-pos)/(bpm*GRP)*60);
  beatv.textContent='♩'+(INBAR[Math.min(TOT-1,Math.floor(pos))]||'1/4');
  const pct=pos/TOT*100;
  fill.style.width=pct+'%'; knob.style.left=pct+'%';
  sb.setAttribute('aria-valuenow',Math.round(pct));
  const st=psts[m.row], x0=r.offsetLeft+st.offsetLeft, sw=st.offsetWidth;
  const k=Math.max(0,Math.min(m.beats-1,Math.floor(a.b))), fr=a.b-k;
  const mx=x0 + sw*(m.gx[k]+(m.gx[k+1]-m.gx[k])*fr)/100;
  if(ribbon){
    if(jump) jump.style.display='none';          /* 跑马灯是展开的，没有跳转 */
    if(jwarn) jwarn.style.display='none';
    paper.style.transform='translate('+(stage.clientWidth*0.33-mx)+'px,-50%)'; return;
  }
  /* 判跳转要看源谱上的小节位置，不能看谱条顺序 ——
     跳进 ② 房子时「下一条谱」恰好就是紧接着的那条，但横向跳过了几小节。 */
  const nx=a.i+1;
  let warn=false, back=false;
  if(jump && nx<PL.length){
    const n=PL[nx], rowsN=(S.rows[m.sr]||{bb:[]}).bb.length;
    const natural = (n.sr===m.sr && n.b0===m.b1)
                 || (n.sr===m.sr+1 && m.b1===rowsN && n.b0===0);
    if(!natural){
      const left=CUM[nx]-pos, lead=Math.max(4, GRP*2);
      warn = left>=0 && left<=lead;
      back = n.sr<m.sr || (n.sr===m.sr && n.b0<m.b1);
    }
  }
  if(warn){
    const tr=prows[PL[nx].row], ts=psts[PL[nx].row];
    jump.style.display='block';
    jump.style.left=(tr.offsetLeft+ts.offsetLeft+ts.offsetWidth*PL[nx].gx[0]/100)+'px';
    jump.style.top=tr.offsetTop+'px';
    jump.style.height=tr.offsetHeight+'px';
  } else if(jump) jump.style.display='none';
  const top=r.offsetTop, h=r.offsetHeight;
  if(warn && jwarn){
    jwarn.style.display='block';
    jwarn.textContent=(back?'↩ ':'⤵ ')+Math.ceil((CUM[nx]-pos)/GRP)+' 拍后跳'
      +(back?'回':'到')+'第 '+(PL[nx].row+1)+' 行第 '+(PL[nx].b0+1)+' 小节';
    jwarn.style.left=mx+'px';
    jwarn.style.top=(top-30)+'px';
  } else if(jwarn) jwarn.style.display='none';
  band.style.display=cue.style.display='block';
  band.style.top=top+'px'; band.style.height=h+'px';
  band.style.left=x0+'px'; band.style.width=sw+'px';
  /* 高度只在换行时改（会引起 layout），位置每帧只改 transform（只走合成器） */
  if(cue.style.height!==h+'px') cue.style.height=h+'px';
  cue.style.transform='translate3d('+mx+'px,'+top+'px,0)';
}

function follow(dt){
  if(ribbon||!PL.length) return;
  const i=at(pos).i, r=prows[PL[i].row], vh=stage.clientHeight;
  /* 当前行尽量靠上，好把下一行也带进视野——换行时才有预读时间。
     原来留 20% 在上方，下一行常常露不全，换行像是突然蹦出来。 */
  if(!playing && pos<=0){ sy=0; stage.scrollTop=0; written=0; return; }  /* 未播放时停在顶端看标题 */
  let want=r.offsetTop - vh*0.08;
  const nx=(i+1<PL.length)? prows[PL[i+1].row] : null;
  if(nx && nx!==r && nx.offsetTop>r.offsetTop){
    const need=nx.offsetTop + nx.offsetHeight + 8 - vh;   /* 让下一行底边也进来 */
    want=Math.max(want, Math.min(need, r.offsetTop - 6)); /* 但当前行的顶不能被顶出去 */
  }
  want=Math.max(0, Math.min(stage.scrollHeight-stage.clientHeight, want));
  if(dt===null||REDUCE||Math.abs(want-sy)>stage.clientHeight*1.3) sy=want;
  else sy += (want-sy)*Math.min(1,dt*6);
  stage.scrollTop=sy; written=stage.scrollTop;
}
let fid=0;
function say(t){ flash.textContent=t; flash.classList.add('on');
  clearTimeout(fid); fid=setTimeout(()=>flash.classList.remove('on'),1500); }

function frame(t){
  if(!playing) return;
  if(!last) last=t;
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if(!drag) pos+=bpm*GRP/60*dt;
  if(pos>=TOT){ pos=TOT; paint(); follow(dt); P.stop(); say('谱终'); return; }
  paint(); follow(dt);
  raf=requestAnimationFrame(frame);
}
async function wake(on){ try{
  if(on && 'wakeLock' in navigator) lock=await navigator.wakeLock.request('screen');
  else if(lock){ await lock.release(); lock=null; } }catch(e){} }

/* at 可指定音频时间轴上的起点，让预备拍和正式演奏接在同一条格子上 */
function anchor(at){ if(!acx) return; aT=(at!=null?at:acx.currentTime); aPos=pos; nb=Math.ceil(pos-1e-6); }
/* lv: 2=小节头 1=主拍 0=细分 */
function tickAt(t,lv){
  const o=acx.createOscillator(), g=acx.createGain();
  o.type='square'; o.frequency.value=lv===2?1600:lv===1?1050:780;
  o.connect(g); g.connect(acx.destination);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(lv===2?0.34:lv===1?0.19:0.085,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.start(t); o.stop(t+0.07); pend.push(o);
  if(pend.length>8) pend.splice(0,pend.length-8);
}
function hush(){ pend.forEach(o=>{try{o.stop();}catch(e){}}); pend=[]; }
/* 预排窗口 1 秒。原先 0.25 秒且挂在 rAF 上：页面一卡（滚动、重绘），
   rAF 停摆超过窗口，那几拍就被整段跳过——仿真里 600ms 卡顿丢 10 下、
   最大间隔偏差 882ms，听上去就是忽快忽慢。
   现在由独立定时器驱动，窗口 1 秒，900ms 卡顿下偏差仍只有 0.1ms。 */
function sched(){
  if(!metro||!acx||(!playing&&!armed)) return;
  const now=acx.currentTime, hz=now+1.0, ups=bpm*GRP;
  while(nb<=TOT){ const t=aT+(nb-aPos)*60/ups;
    if(t>hz) break;
    const lv = DOWN[nb]?2 : CLK[nb]?1 : -1;
    if(t>now-0.02 && (lv>=0 || subdiv)) tickAt(Math.max(t,now), lv<0?0:lv);
    /* 单拍子（4/4、3/4…）里「单位」就等于主拍，没有更细的格子，
       细分只能靠在两拍之间补一个八分音符点。复合拍子（6/8）不用补，
       它的单位本来就比主拍细，上面那行已经打出来了。 */
    if(subdiv && GRP===1 && lv>=0){
      const th=t+30/ups;
      if(th>now-0.02) tickAt(Math.max(th,now), 0);
    }
    nb++; }
}
function audio(){ if(acx){ if(acx.state==='suspended') acx.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(C){ acx=new C(); anchor(); } }
function setMetro(on){ metro=!!on; lss('metro',metro?'1':'0'); if(!metro) hush();
  $('met').setAttribute('aria-pressed',String(metro)); if(metro){ audio(); anchor(); } }
function setBpm(v){ bpm=Math.max(40,Math.min(160,Math.round(v)));
  durv.textContent=popv.textContent=bpm;
  popt.textContent='全程 '+mmss(dur());
  $('popu').textContent = GRP>1 ? '主拍 / 分钟（附点四分）' : '拍 / 分钟';
  spv.value=bpm; if(S){ S.bpm=bpm; save(); } anchor(); paint(); }

let schedTimer=0;
function startSched(){ clearInterval(schedTimer); schedTimer=setInterval(sched,25); }
function stopSched(){ clearInterval(schedTimer); schedTimer=0; }
const PLAYD='M1 1.2 14 8.5 1 15.8Z', PAUSED='M1.5 1h4v15h-4ZM9.5 1h4v15h-4Z';
function icon(){ pico.firstElementChild.setAttribute('d', playing?PAUSED:PLAYD); }
const P={
  go(audioAt){ last=0; playing=true; icon(); wake(true); if(metro) audio();
        /* armed 表示预备拍已经把格子定好、排程器也在跑了，这里不能重新对齐——
           iPad 上音频时钟和页面时钟有偏差，重新对齐会把第 1 拍算成「已过期」而跳过。 */
        if(!armed){ anchor(audioAt); startSched(); }
        armed=false;
        raf=requestAnimationFrame(frame); idle(); },
  stop(){ if(!playing && !raf) return;
        playing=false; armed=false; cancelAnimationFrame(raf); raf=0; stopSched(); icon(); wake(false); hush();
        dock.classList.remove('dim'); clearTimeout(tid); paint(); }
};
function toggle(){
  if(cid){                       /* 预备拍途中再按 = 取消 */
    clearInterval(cid); cid=0; count.hidden=true;
    armed=false; stopSched(); hush(); return;
  }
  if(playing){ P.stop(); return; }
  /* 从头开始才给一小节预备拍；暂停后从中途续播直接开始，不再数拍 */
  if(pos>0.01 && pos<TOT) P.go(); else countIn();
}
let cid=0;
/* 预备拍 = 按当前速度实打一小节，频率和正式演奏完全一致（含细分），
   起拍前就已经进了节奏，不用现找。 */
function countIn(){
  if(!PL.length) return;
  clearInterval(cid); if(metro) audio();
  if(pos>=TOT) seek(0);
  const m=PL[at(pos).i];
  const units=(m.bars&&m.bars[0])||GRP*2;          /* 第一小节有几个单位 */
  const spu=60/(bpm*GRP);                          /* 每个单位多少秒 */
  const mains=Math.max(1,Math.ceil(units/GRP));    /* 这一小节几个主拍 */
  count.hidden=false; count.firstElementChild.textContent=mains;
  let playAt=null;
  if(metro&&acx){
    const t0=acx.currentTime+0.06;
    for(let u=0;u<units;u++){
      const main=(u%GRP)===0;
      if(main||subdiv) tickAt(t0+u*spu, u===0?2:(main?1:0));
      if(subdiv && GRP===1) tickAt(t0+u*spu+spu/2, 0);   /* 预备拍也要带上细分 */
    }
    playAt=t0+units*spu;        /* 正式第一拍 = 预备拍之后恰好一格，接得上 */
    anchor(playAt);             /* 立刻定下正式演奏的格子 */
    armed=true; startSched();   /* 让排程器现在就把第 1 拍排进队列，别等交接那一刻 */
  }
  const t0ms=performance.now()+60, total=units*spu*1000;
  cid=setInterval(()=>{
    const el=performance.now()-t0ms;
    if(el>=total){ clearInterval(cid); cid=0; count.hidden=true; P.go(playAt); return; }
    count.firstElementChild.textContent=Math.max(1, mains-Math.floor(el/(spu*GRP*1000)));
  },40);
}
function seek(u){ pos=Math.max(0,Math.min(TOT,u)); cur=-1; anchor(); paint(); follow(null); }
function rowTo(i){ i=Math.max(0,Math.min(PL.length-1,i)); seek(CUM[i]+1e-6); }
function prevRow(){ const a=at(pos); rowTo((a.b>1.2||a.i===0)?a.i:a.i-1); }
let tid=0;
function idle(){ clearTimeout(tid); dock.classList.remove('dim');
  if(playing) tid=setTimeout(()=>dock.classList.add('dim'),3000); }
function layout(){
  if(ribbon){
    if(!PL.length) return;
    /* 所有行用同一个缩放比例 k，谱面大小才一致。
       早先是「每行都压成同样的像素高度」，高的行被压扁、矮的行被放大，
       结果同一首歌里字一会儿大一会儿小。 */
    const avail=Math.max(150, Math.min(stage.clientHeight-18, 360));
    let maxBand=1;
    PL.forEach(m=>{ if(m.ch>maxBand) maxBand=m.ch; });
    const k=avail/maxBand;
    /* 再按谱表中心对齐，一条条谱读起来才是连着的 */
    const A=PL.map(m=>m.sc*k);
    const maxA=Math.max.apply(null,A);
    prows.forEach((r,i)=>{ const st=psts[i];
      const w=PL[i].cw*k, h=PL[i].ch*k;
      r.style.width=w+'px'; r.style.height=h+'px'; r.style.marginTop=(maxA-A[i])+'px';
      st.style.width=w+'px'; st.style.height=h+'px'; });
  } else {
    prows.forEach((r,i)=>{ r.style.width=r.style.height=r.style.marginTop='';
      psts[i].style.width=psts[i].style.height=''; });
    paper.style.transform='';
    /* 浏览器先把谱条流式排好，再按「落在同一行的那几条」对齐谱表中心。
       必须分两趟：加了 margin-top 之后 offsetTop 会变，不能边读边改。 */
    const tops=prows.map(r=>r.offsetTop);
    const lines={};
    tops.forEach((t,i)=>{ const k=Math.round(t/4)*4; (lines[k]=lines[k]||[]).push(i); });
    Object.keys(lines).forEach(k=>{
      const idx=lines[k];
      if(idx.length<2){ return; }
      const h=prows[idx[0]].offsetHeight / (PL[idx[0]].ch||1);   /* 当前缩放 */
      let maxA=0; const A=idx.map(i=>{
        const a=PL[i].sc * (prows[i].offsetHeight/(PL[i].ch||1));
        if(a>maxA) maxA=a; return a; });
      idx.forEach((i,j)=>{ prows[i].style.marginTop=(maxA-A[j])+'px'; });
    });
  }
}
function applyMode(){
  stage.classList.toggle('ribbon',ribbon);
  $('mode').setAttribute('aria-pressed',String(ribbon));
  $('mode').textContent = ribbon?'整页':'跑马灯';
  layout(); paint(); if(!ribbon) follow(null);
}
function setMode(on){
  ribbon=!!on; lss('ribbon',ribbon?'1':'0');
  const keep=pos; buildPlay(); seek(keep);   /* 两种排法的 DOM 不同，必须重建 */
}

$('play').onclick=e=>{ e.stopPropagation(); toggle(); };
$('prev').onclick=e=>{ e.stopPropagation(); prevRow(); };
$('next').onclick=e=>{ e.stopPropagation(); rowTo(at(pos).i+1); };
$('rst').onclick =e=>{ e.stopPropagation(); P.stop(); seek(0); };
$('met').onclick =e=>{ e.stopPropagation(); setMetro(!metro); };
function setSub(on){ subdiv=!!on; lss('subdiv',subdiv?'1':'0');
  $('sub').setAttribute('aria-pressed',String(subdiv)); if(!subdiv) hush(); }
$('sub').onclick =e=>{ e.stopPropagation(); setSub(!subdiv); };
$('mode').onclick=()=>setMode(!ribbon);
$('spd').onclick =e=>{ e.stopPropagation(); spdpop.hidden=!spdpop.hidden;
  $('spd').setAttribute('aria-expanded',String(!spdpop.hidden)); };
spdpop.onclick=e=>e.stopPropagation();
spv.oninput=()=>setBpm(+spv.value);
addEventListener('pointerdown',e=>{ if(!spdpop.hidden && !spdpop.contains(e.target) && e.target!==$('spd')){
  spdpop.hidden=true; $('spd').setAttribute('aria-expanded','false'); } },true);

let ct=0;
stage.onclick=e=>{
  if(!count.hidden) return;
  const now=Date.now();
  if(now-ct<320){ ct=0; pick(e.clientY); return; }
  ct=now; setTimeout(()=>{ if(ct && Date.now()-ct>=320){ ct=0; toggle(); } },330);
};
function pick(clientY){
  if(ribbon||!prows.length) return;
  const y=clientY-paper.getBoundingClientRect().top; let best=0;
  prows.forEach((r,i)=>{ if(y>=r.offsetTop) best=i; });
  const k=PL.findIndex(m=>m.row===best);
  rowTo(k<0?0:k); say('→ 第'+((k<0?0:k)+1)+'段');
}
stage.onscroll=()=>{ if(ribbon||drag) return;
  if(playing && Math.abs(stage.scrollTop-written)>3){ P.stop(); say('已停住'); } };
function grab(e){ const b=sb.getBoundingClientRect();
  seek(Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*TOT); }
sb.addEventListener('pointerdown',e=>{ drag=true; e.preventDefault();
  try{ sb.setPointerCapture(e.pointerId); }catch(_){} grab(e); });
sb.addEventListener('pointermove',e=>{ if(drag) grab(e); });
['pointerup','pointercancel'].forEach(ev=>sb.addEventListener(ev,e=>{ drag=false;
  try{ sb.releasePointerCapture(e.pointerId); }catch(_){} }));

addEventListener('keydown',e=>{
  if($('playView').hidden) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.key!=='Escape') return;
  const k=e.key;
  if(k===' '||k==='Enter'||k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); toggle(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prevRow(); }
  else if(k==='ArrowDown'){ e.preventDefault(); rowTo(at(pos).i+1); }
  else if(k==='ArrowUp'){ e.preventDefault(); prevRow(); }
  else if(k==='['){ setBpm(bpm-2); } else if(k===']'){ setBpm(bpm+2); }
  else if(k==='m'||k==='M'){ setMetro(!metro); }
  else if(k==='s'||k==='S'){ setSub(!subdiv); }
  else if(k==='r'||k==='R'){ P.stop(); seek(0); }
  else if(k==='Escape'){ spdpop.hidden=true; }
});
['pointermove','pointerdown'].forEach(ev=>addEventListener(ev, idle));
addEventListener('resize',()=>{ fit(); layout(); paint(); if(!playing) follow(null); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && playing) wake(true); });

/* 自测钩子：整页逻辑包在 IIFE 里，外部拿不到内部状态，
   脚本化回归测试（scripts/selftest.py）就没法验证游标格子和滚动行为。
   只读暴露，不提供任何修改入口，对正常使用没有影响。 */
window.__GS = {
  get song(){ return S; },
  get play(){ return PL; },
  get total(){ return TOT; },
  get ribbon(){ return ribbon; },
  at: u => at(u),
  get order(){ return (LIB||[]).map(x=>x.id); },
  ordCode: () => ordCode(),
  ordApply: c => { const ids=ordFromCode(c); if(!ids) return false;
                   ORD=ids; ordWrite(); applyOrd(); renderLib(); return true; },
  seek: u => { seek(u); },
  follow: () => follow(null)
};

/* 目录页跳过来的（?lib=1）：露出返回键，并且把「曲库」页签也改成回目录——
   单曲页里的「曲库」本来只会列出这一首，从目录过来时那个列表没有意义。 */
(function(){
  try{
    if(!/[?&]lib=1(&|$)/.test(location.search)) return;
    const b=$('back'); if(!b) return;
    b.hidden=false;
    $('tabLib').onclick=()=>{ location.href=b.getAttribute('href'); };
  }catch(e){}
})();

boot();
})();
</script>
</body></html>
