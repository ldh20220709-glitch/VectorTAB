<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>吉他弹唱动态谱</title>
<style>
:root{
  color-scheme:light dark;
  --ground:#EFEBE3; --panel:#FDFCFA; --ink:#1C1A17; --muted:#6E665C; --line:#D9D2C5;
  --accent:#C06A22; --accent-ink:#FFF7EE;
  --shadow:0 1px 2px rgba(28,26,23,.10),0 8px 28px rgba(28,26,23,.10);
  --num:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--cjk);
     padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;z-index:5;background:var(--ground);
     border-bottom:1px solid var(--line);padding:13px 14px 11px}
.top .wrap{display:flex;align-items:baseline;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
.top .n{font-family:var(--num);font-size:12px;color:var(--muted)}
.wrap{max-width:860px;margin:0 auto}
main{padding:14px 14px 48px}
#q{width:100%;font-family:var(--cjk);font-size:14px;color:var(--ink);background:var(--panel);
   border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:0 0 14px;
   -webkit-appearance:none;appearance:none}
#q:focus{outline:none;border-color:var(--accent)}
.bar{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bar b{font-size:18px;font-weight:600}
.bar .sp{flex:1 1 auto}
.sm{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
    font-family:var(--cjk);font-size:12px;font-weight:600;padding:6px 10px;cursor:pointer}
.sm:hover{color:var(--ink);border-color:var(--accent)}
.tip{font-size:12px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
.tip b{color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
      padding:12px 14px;display:flex;align-items:center;gap:11px;margin-bottom:9px;
      text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--num);font-size:13px;color:var(--muted);
          min-width:26px;text-align:right;flex:0 0 auto}
.card .nm{flex:1;min-width:0;font-size:17px;font-weight:600;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-family:var(--num);font-size:12px;color:var(--muted);flex:0 0 auto}
.card .sig{font-family:var(--num);font-size:12px;font-weight:700;color:var(--accent);
      border:1px solid var(--accent);border-radius:5px;padding:2px 6px;flex:0 0 auto}
.mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.mv button{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);
      border-radius:5px;width:28px;height:17px;line-height:1;font-size:10px;cursor:pointer;padding:0}
.mv button:hover:not(:disabled){color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.mv button:disabled{opacity:.3;cursor:default}
.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
    font-family:var(--cjk);font-size:12px;font-weight:600;border-radius:6px;
    padding:7px 12px;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:36px 10px}
.foot{color:var(--muted);font-size:12px;line-height:1.9;margin-top:22px;
      border-top:1px solid var(--line);padding-top:14px}
</style></head><body>
<header class="top"><div class="wrap">
  <h1>吉他弹唱动态谱</h1><span class="n" id="cnt"></span>
</div></header>
<main class="wrap">
  <input type="search" id="q" placeholder="搜歌名" autocomplete="off" spellcheck="false" aria-label="按歌名搜索">
  <div id="list"></div>
  <div class="foot">
    每首是独立的一页，点开才下载那一首的谱面。<br>
    单曲页本身自包含——可以单独发给别人，断网也能弹。
  </div>
</main>
<script>
const SONGS=[{"id": "sg-1cfe67ed6d75", "title": "成都", "file": "成都-吉他动态谱.html", "key": "1 = C", "sig": "6/8", "bpm": 68}, {"id": "sg-87f08416007c", "title": "弯弯的月亮", "file": "弯弯的月亮-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 68}, {"id": "sg-94f349b31237", "title": "声声慢", "file": "声声慢-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 68}, {"id": "sg-944c74d45f4a", "title": "你是人间四月天", "file": "你是人间四月天-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 72}, {"id": "sg-fe23f7c63bd7", "title": "一次就好", "file": "一次就好-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 66}, {"id": "sg-d365f9dd26c1", "title": "栀子花开", "file": "栀子花开-吉他动态谱.html", "key": "1 = C", "sig": "3/4", "bpm": 96}, {"id": "sg-36690f0e82c8", "title": "情非得已", "file": "情非得已-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 72}, {"id": "sg-aa49f6f5d093", "title": "隐形的翅膀", "file": "隐形的翅膀-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 70}, {"id": "sg-d729d5a0aadf", "title": "来生缘", "file": "来生缘-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 66}, {"id": "sg-7bcfac491d95", "title": "星空", "file": "星空-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 76}, {"id": "sg-edf73602db69", "title": "同桌的你", "file": "同桌的你-吉他动态谱.html", "key": "1 = C", "sig": "6/8", "bpm": 56}, {"id": "sg-b04211cf2da6", "title": "春天里", "file": "春天里-吉他动态谱.html", "key": "1 = C", "sig": "6/8", "bpm": 50}, {"id": "sg-19f14860b48f", "title": "余香", "file": "余香-吉他动态谱.html", "key": "1 = C", "sig": "6/8", "bpm": 52}, {"id": "sg-d490b5fd608e", "title": "朋友", "file": "朋友-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 66}, {"id": "sg-e47cd1e407d0", "title": "往后余生", "file": "往后余生-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 72}, {"id": "sg-e4e698287c50", "title": "有没有人告诉你", "file": "有没有人告诉你-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 62}, {"id": "sg-839cf8772fef", "title": "传奇", "file": "传奇-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 66}, {"id": "sg-26e6b6e14f05", "title": "滴答", "file": "滴答-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 66}, {"id": "sg-79f43157ab14", "title": "星语心愿", "file": "星语心愿-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 68}, {"id": "sg-74d77bc01540", "title": "声声慢（进阶）", "file": "声声慢（进阶）-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 68}, {"id": "sg-f24620cd3f66", "title": "灰姑娘", "file": "灰姑娘-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 72}, {"id": "sg-4858d49e58b2", "title": "后来", "file": "后来-吉他动态谱.html", "key": "1 = C", "sig": "4/4", "bpm": 66}, {"id": "sg-1f98066a3c39", "title": "温柔", "file": "温柔-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 72}, {"id": "sg-d94485d7d47d", "title": "那些花儿", "file": "那些花儿-吉他动态谱.html", "key": "1 = G", "sig": "2/4", "bpm": 88}, {"id": "sg-92c1b6c8fd3f", "title": "旅行", "file": "旅行-吉他动态谱.html", "key": "1 = D", "sig": "4/4", "bpm": 72}, {"id": "sg-1a0ce6d6cf3e", "title": "月亮代表我的心", "file": "月亮代表我的心-吉他动态谱.html", "key": "1 = A", "sig": "4/4", "bpm": 68}, {"id": "sg-405ad9124220", "title": "我们的时光", "file": "我们的时光-吉他动态谱.html", "key": "1 = E", "sig": "4/4", "bpm": 76}, {"id": "sg-c469fa4e9e10", "title": "你的眼神", "file": "你的眼神-吉他动态谱.html", "key": "1 = F", "sig": "4/4", "bpm": 66}, {"id": "sg-948066a68a79", "title": "可可托海的牧羊人", "file": "可可托海的牧羊人-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 72}, {"id": "sg-60918311bdc2", "title": "成都（进阶）", "file": "成都（进阶）-吉他动态谱.html", "key": "1 = C", "sig": "6/8", "bpm": 68}, {"id": "sg-4c83cc194f6f", "title": "多年以后", "file": "多年以后-吉他动态谱.html", "key": "1 = G", "sig": "4/4", "bpm": 70}];
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

/* ======== 曲目顺序 ========
   纯静态页面没有后端，跨终端只能三层叠着用：
     1. localStorage —— 本机立刻生效，file:// 也行，只认这一台设备。
     2. 同目录 order.json —— 走 http(s) 时开页就拉，推几百字节就能让所有设备同步。
     3. 顺序码 —— 一串能复制粘贴的文本，离线也能把顺序带到另一台设备。
   谁新用谁（比 ts），本机改动永远立刻生效，不会被云端悄悄盖掉。 */
const OKEY='gs2.order';
let ORD=null, ORDTS=0, ordNote=false, LIST=SONGS.slice();
const sid6=id=>String(id||'').replace(/^sg-/,'').slice(0,6);

function ordRead(){ try{ const o=JSON.parse(localStorage.getItem(OKEY)||'null');
  if(o&&Array.isArray(o.ids)){ ORD=o.ids; ORDTS=o.ts||0; } }catch(e){} }
function ordWrite(){ ORDTS=Date.now();
  try{ localStorage.setItem(OKEY,JSON.stringify({v:1,ts:ORDTS,ids:ORD})); }catch(e){} }
function ordCode(){ return 'GS1'+(ORD||SONGS.map(x=>x.id)).map(sid6).join(''); }
function ordFromCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(!/^GS1[0-9a-f]+$/i.test(code)||(code.length-3)%6) return null;
  const by={}; SONGS.forEach(x=>{ by[sid6(x.id)]=x.id; });
  const ids=(code.slice(3).toLowerCase().match(/.{6}/g)||[]).map(k=>by[k]).filter(Boolean);
  return ids.length?ids:null;
}
async function ordFetch(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('order.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const o=await r.json();
    if(!o||!Array.isArray(o.ids)) return;
    /* 钳住未来时间：order.json 里写了个未来的 ts 会永远压过本机，
       用户在这台设备上调的顺序一刷新就被悄悄吃掉。 */
    const rt=Math.min(Number(o.ts)||0, Date.now());
    if(rt<=ORDTS) return;
    ORD=o.ids; ORDTS=rt; ordWrite(); ordNote=true;
  }catch(e){}
}
function applyOrd(){
  if(!ORD||!ORD.length){ LIST=SONGS.slice(); return; }
  const pos={}; ORD.forEach((id,i)=>{ pos[id]=i; });
  const known=[],rest=[];
  SONGS.forEach(x=>(pos[x.id]!=null?known:rest).push(x));
  known.sort((a,b)=>pos[a.id]-pos[b.id]);
  LIST=known.concat(rest);                 /* 新加的曲子排在后面，不会丢 */
}
function move(id,dir){
  const i=LIST.findIndex(x=>x.id===id), j=i+dir;
  if(i<0||j<0||j>=LIST.length) return;
  const t=LIST[i]; LIST[i]=LIST[j]; LIST[j]=t;
  ORD=LIST.map(x=>x.id); ordWrite(); ordNote=false; render();
}
function ordDialog(){
  const code=ordCode();
  const v=prompt('当前顺序码（复制走，在别的设备上再粘回来）：\n\n'+code+
    '\n\n要应用别处来的顺序，把那串码粘在这里再按确定；按取消则不动。', code);
  if(v==null||v.trim()===code) return;
  const ids=ordFromCode(v);
  if(!ids){ alert('这串码不对，或者里面的曲子这个目录里没有。'); return; }
  ORD=ids; ordWrite(); applyOrd(); render();
  alert('顺序已套用（'+ids.length+' 首）。');
}

function render(){
  const L=$('list'); L.textContent='';
  const kw=($('q').value||'').trim().toLowerCase();
  const show=kw?LIST.filter(x=>x.title.toLowerCase().includes(kw)):LIST;
  $('cnt').textContent = kw ? show.length+' / '+LIST.length+' 首' : '共 '+LIST.length+' 首';
  const bar=el('div','bar');
  bar.appendChild(el('b',null,'曲目'));
  bar.appendChild(el('span','sp',''));
  const bc=el('button','sm','顺序码'); bc.onclick=ordDialog; bar.appendChild(bc);
  if(ORD&&ORD.length){
    const br=el('button','sm','默认顺序');
    br.onclick=()=>{ if(!confirm('恢复成文件自带的顺序？')) return;
      ORD=null; ORDTS=0; try{ localStorage.removeItem(OKEY); }catch(e){}
      applyOrd(); render(); };
    bar.appendChild(br);
  }
  L.appendChild(bar);
  if(ordNote){ const t=el('div','tip');
    t.innerHTML='曲目顺序已按 <b>order.json</b> 更新。在这里调一下 ▲▼ 就会以本机为准。';
    L.appendChild(t); }
  if(kw){ const t=el('div','tip');
    t.innerHTML='搜索时不能调顺序——<b>清空搜索框</b>再用 ▲▼。'; L.appendChild(t); }
  if(!show.length){ L.appendChild(el('div','empty', kw?'没有叫「'+$('q').value.trim()+'」的曲子。':'还没有曲目。')); return; }
  show.forEach(s=>{
    const i=LIST.indexOf(s);
    const a=el('a','card'); a.href=s.file+'?lib=1';
    a.appendChild(el('span','no',String(i+1)));
    a.appendChild(el('b','nm',s.title));
    if(s.sig) a.appendChild(el('span','sig',s.sig));
    a.appendChild(el('span','meta',(s.key||'')+(s.bpm?'  '+s.bpm+' BPM':'')));
    const mv=el('div','mv');
    const up=el('button',null,'▲'), dn=el('button',null,'▼');
    up.type=dn.type='button';
    up.setAttribute('aria-label','上移'); dn.setAttribute('aria-label','下移');
    up.disabled=!!kw||i<=0; dn.disabled=!!kw||i>=LIST.length-1;
    const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
    up.onclick=e=>{ stop(e); move(s.id,-1); };
    dn.onclick=e=>{ stop(e); move(s.id,1); };
    mv.append(up,dn); a.appendChild(mv);
    a.appendChild(el('span','go','演奏'));
    L.appendChild(a);
  });
}
$('q').oninput=render;
ordRead();
const h=(location.hash||'').match(/[#&]o=(GS1[0-9a-f]+)/i);
if(h){ const ids=ordFromCode(h[1]); if(ids){ ORD=ids; ordWrite(); } }
applyOrd(); render();
ordFetch().then(()=>{ applyOrd(); render(); });
window.__CAT={ get list(){ return LIST.map(x=>x.id); }, ordCode:()=>ordCode(),
               ordApply:c=>{ const ids=ordFromCode(c); if(!ids) return false;
                             ORD=ids; ordWrite(); applyOrd(); render(); return true; } };
</script></body></html>
