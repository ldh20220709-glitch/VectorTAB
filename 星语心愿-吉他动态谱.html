<script>
/* ===== 离线后端：曲目结构和图片都放 localStorage，file:// 下可用 ===== */
(function(){
  var K='gs2.', IMG={}, SONGS={};
  function rd(k,d){ try{ var v=localStorage.getItem(K+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  var GONE={};
  try{ IMG=rd('imgs',{}); SONGS=rd('songs',{}); GONE=rd('gone',{}); }catch(e){}
  /* 单曲离线包把数据直接挂在页面上，不经 localStorage——
     file:// 下存储可能被限制或配额不足，静默失败就会打开一片空白 */
  if(window.__SEED){
    try{
      var sd=window.__SEED;
      var pack = sd.songs || (sd.id ? (function(){var o={};o[sd.id]=sd.song;return o;})() : {});
      window.__SEEDN = Object.keys(pack).length;
      window.__SEEDIDS = Object.keys(pack);        /* 给曲库页标注哪些是随文件带来的 */
      var si=sd.imgs||{};
      for(var sk in si) IMG[sk]=si[sk];            /* 图片先并进来，下面要靠它判断 */
      /* 文件永远赢。
         以前的写法是「本机那份的图片还找得着就保留本机的」，意图是保住用户自己的改动。
         但本地改谱的入口早就去掉了，localStorage 在这里只是缓存，不该有话语权。
         那条规则的实际后果是：谱面数据（m0 / 小节线 / 演奏顺序 / 段落）修好并重新发布后，
         凡是以前打开过这首歌的浏览器**永远拿不到新数据**——图片内容没变、哈希没变、
         id 也没变，判定一直是「本机那份还活着」，于是旧记录一直赢。
         实测现象：《弯弯的月亮》游标仍停在谱表左缘（旧的 bl[0]），而文件里的 m0 早就改对了；
         两台设备谁先打开过谁就卡在更老的数据上，看起来像「手机和电脑不一致」。
         顺带也不再看 GONE —— 删除入口同样早就没有了，留着只会让曲目凭空消失。 */
      for(var sid in pack) SONGS[sid]=pack[sid];
    }catch(e){}
  }
  function wr(k,v){ localStorage.setItem(K+k, JSON.stringify(v)); }   /* 满了会抛，向上传 */
  function nid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  window.__OFFLINE=true;
  window.__BLOB=function(id){ return IMG[id]||''; };
  /* 只统计真正写进 localStorage 的部分。随文件带来的内置曲目不占配额，
     早先把它们也算进去，会报出一个根本不存在的「快满了」。 */
  window.__USAGE=function(){
    var n=0; try{ n=(localStorage.getItem(K+'imgs')||'').length
                  + (localStorage.getItem(K+'songs')||'').length; }catch(e){}
    return n; };
  window.__SEEDN=0;
  window.__WIPE=function(){
    try{ localStorage.removeItem(K+'imgs'); localStorage.removeItem(K+'songs');
         localStorage.removeItem(K+'gone'); }catch(e){}
  };
  window.__EXPORT=function(){ return {v:1, songs:SONGS, imgs:IMG}; };
  window.__IMPORT=function(o){
    if(!o||!o.songs) throw new Error('不是 VectorTAB 的备份文件');
    for(var k in o.songs) SONGS[k]=o.songs[k];
    for(var j in (o.imgs||{})) IMG[j]=o.imgs[j];
    wr('songs',SONGS); wr('imgs',IMG);
  };

  var db={ collection:function(){ return {
    get:function(){ return Promise.resolve({docs:Object.keys(SONGS).map(function(id){
      return {id:id, exists:true, data:function(){ return SONGS[id]; }}; })}); },
    doc:function(id){ id=id||nid('s'); return {
      id:id,
      set:function(v){ SONGS[id]=v; try{ wr('songs',SONGS); }catch(e){
          return Promise.reject(new Error('本地存储满了，先导出备份再删掉用不上的曲目')); }
        return Promise.resolve(); },
      delete:function(){ delete SONGS[id]; GONE[id]=1;      /* 记下来，免得内置曲目刷新又冒出来 */
        try{ wr('songs',SONGS); wr('gone',GONE); }catch(e){} return Promise.resolve(); },
      get:function(){ return Promise.resolve({id:id, exists:!!SONGS[id], data:function(){ return SONGS[id]; }}); }
    }; } }; } };

  var assets={
    upload:function(f){ return new Promise(function(ok,no){
      var r=new FileReader();
      r.onload=function(){
        var id=nid('i'); IMG[id]=r.result;
        try{ wr('imgs',IMG); }catch(e){ delete IMG[id];
          no(new Error('本地存储满了（约 5 MB 上限），先「导出备份」再删掉用不上的曲目')); return; }
        ok({id:id, url:r.result});
      };
      r.onerror=function(){ no(new Error('读取图片失败')); };
      r.readAsDataURL(f);
    }); },
    delete:function(id){ delete IMG[id]; try{ wr('imgs',IMG); }catch(e){} return Promise.resolve(); }
  };
  /* 合并而不是覆盖：这份 shim 也会跑在 Artifact 页面里，别踩掉宿主自己挂的东西 */
  var prev = window.claude || {};
  var merged = {}; for(var pk in prev) merged[pk]=prev[pk];
  merged.use = function(n){
    return Promise.resolve(n==='db'?db : n==='assets'?assets : null); };
  window.claude = merged;
})();
</script>
<title>VectorTAB · 维特动态吉他谱</title>
<style>
:root{
  --ground:#EFEBE3; --panel:#FDFCFA; --ink:#1C1A17; --muted:#6E665C; --line:#D9D2C5;
  --accent:#C06A22; --accent-ink:#FFF7EE; --rail:#E0D8CA; --paper:#FFFFFF;
  --accent-soft:rgba(192,106,34,.22); --scrim:rgba(239,235,227,.80);
  --cue:#D62828; --cue-soft:rgba(214,40,40,.065); --cue-glow:rgba(214,40,40,.42);
  --ok:#2F7D56; --leanT:1s;
  --shadow:0 1px 2px rgba(28,26,23,.10),0 8px 28px rgba(28,26,23,.10);
  /* 纯系统字体栈，零外部请求 */
  --num:ui-sans-serif,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106; --rail:#241F18; --ok:#56B183;
  --accent-soft:rgba(231,155,64,.26); --scrim:rgba(17,15,12,.82);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ground:#110F0C; --panel:#1B1915; --ink:#EDE7DB; --muted:#978E82; --line:#2C2821;
  --accent:#E79B40; --accent-ink:#191106; --rail:#241F18; --ok:#56B183;
  --accent-soft:rgba(231,155,64,.26); --scrim:rgba(17,15,12,.82);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 34px rgba(0,0,0,.45);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--cjk);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}

#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));
     background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:6}
/* 从目录页点进来时才出现（链接带 ?lib=1）。
   单独发给别人的文件没有这个参数，看不到这个键，也就不会点出 404。 */
#back{display:none;align-items:center;font-family:var(--cjk);font-size:12px;font-weight:600;
      color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;
      padding:5px 9px;margin-right:2px;white-space:nowrap}
#back:hover{color:var(--ink);border-color:var(--accent)}
#back:not([hidden]){display:inline-flex}
#brand{font-size:15px;font-weight:600;letter-spacing:.04em;white-space:nowrap;color:var(--muted)}
#songname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songname:not(:empty)::before{content:"/";color:var(--line);margin-right:9px;font-weight:400}
#songname b{font-family:var(--num);font-size:12px;font-weight:700;color:var(--accent);
     border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin-left:7px}
#bar .sp{flex:1}
.tabs{display:flex;gap:2px;background:var(--rail);border-radius:8px;padding:2px}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;
     font-family:var(--cjk);font-size:12px;font-weight:600;padding:5px 11px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon,.sm{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;
     font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.06em;padding:6px 10px;cursor:pointer}
.icon:hover,.sm:hover{color:var(--ink);border-color:var(--accent)}
.sm[aria-pressed="true"],.icon[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm.warn:hover{color:var(--cue);border-color:var(--cue)}
.cjk{font-family:var(--cjk);letter-spacing:0}
input[type=text],input[type=number]{font-family:var(--cjk);font-size:13px;color:var(--ink);background:var(--panel);
     border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}

.view{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 40px}
.wrap{max-width:860px;margin:0 auto}

/* ---------- 曲库 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
      display:flex;align-items:center;gap:12px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--num);font-size:13px;color:var(--muted);
  min-width:26px;text-align:right;flex:0 0 auto}
.card .nm{flex:1;min-width:0;font-size:17px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{cursor:pointer}
#q{font-family:var(--cjk);font-size:14px;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;flex:1 1 220px;
  min-width:0;-webkit-appearance:none;appearance:none}
#q:focus{outline:none;border-color:var(--accent)}
.card .t{flex:1;min-width:0}
.card .t b{display:block;font-size:17px;font-weight:600;margin-bottom:3px}
.card .t span{font-family:var(--num);font-size:12px;color:var(--muted)}
.card .sig{font-family:var(--num);font-size:13px;font-weight:700;color:var(--accent);
      border:1px solid var(--accent);border-radius:5px;padding:2px 7px;flex:0 0 auto}
.card .mv{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.card .mv button{appearance:none;background:none;border:1px solid var(--line);color:var(--muted);
     border-radius:5px;width:28px;height:17px;line-height:1;font-size:10px;cursor:pointer;padding:0}
.card .mv button:hover:not(:disabled){color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.card .mv button:disabled{opacity:.3;cursor:default}
.libhd{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.libhd .sp{flex:1 1 auto}
.ordtip{font-size:12px;color:var(--muted);line-height:1.7;margin:-4px 0 12px}
.ordtip b{color:var(--accent);font-weight:600}
.libhd b{font-size:18px;font-weight:600}
.libhd span{font-family:var(--num);font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;padding:36px 10px}
#warn{background:var(--cue);color:#fff;font-size:12px;padding:8px 14px;line-height:1.5}
#warn.info{background:var(--rail);color:var(--muted)}

.row2{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
/* ---------- 演奏（与单曲版同一套） ---------- */
#playView{display:flex;flex-direction:column;padding:0;overflow:hidden}
#wrapP{position:relative;flex:1;min-height:0}
/* 氛围飘落层（四季：花瓣 / 雨点 / 落叶 / 雪花）：盖在谱面上、在小球和工具栏下面，不挡点击。
   每片是一个绝对定位的小元素，用 WAAPI 只动 transform/opacity（走合成器），落完回收进池子 */
#fall{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
#fall .fp{position:absolute;left:0;top:0;will-change:transform,opacity;display:block}
#fall .fp svg{display:block;width:100%;height:100%;overflow:visible}
/* 夏：玻璃上的近景水珠。水珠是个凸透镜：上沿暗（把背后的暗处倒过来）、下沿亮（聚光），左上一点高光，下面一圈投影 */
#fall .gd{position:absolute;left:0;top:0;will-change:transform,opacity}
#fall .gd svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;transform-origin:50% 100%;
  filter:drop-shadow(0 1.4px 1.3px rgba(8,45,75,.32))}
/* 拖尾：水珠尖上跟一小截，向上变细变淡（用户点名喜欢这版）。
   不许「平滑缩回再伸长」：卡住时保持不动；窜一次长一截、越拉越细，拉过头就断开，上半截留在玻璃上珠化成小水点。
   试过的两种都被否了：①随「窜/卡」伸缩——停下缩回再窜又伸长，用户说是 bug；
   ②留在玻璃上的长湿痕——变成一条贯穿的直线，用户说不如短拖尾好看 */
#fall .gk{position:absolute;left:0;top:0;will-change:transform,opacity;transform-origin:50% 100%;border-radius:50% 50% 40% 40%/90% 90% 10% 10%;
  background:linear-gradient(to top,rgba(225,242,252,.6),rgba(150,200,230,.3) 50%,rgba(150,200,230,0));
  box-shadow:inset .8px 0 .8px rgba(8,55,90,.16),inset -.8px 0 .8px rgba(8,55,90,.1)}
#fall .gd i{position:absolute;left:50%;bottom:62%;transform-origin:50% 100%;border-radius:50% 50% 40% 40%/90% 90% 10% 10%;
  background:linear-gradient(to top,rgba(225,242,252,.75),rgba(150,200,230,.35) 45%,rgba(150,200,230,0));
  box-shadow:inset .8px 0 .8px rgba(8,55,90,.18),inset -.8px 0 .8px rgba(8,55,90,.12)}
/* 雨点落地溅起的水花：几颗小水珠抛物线弹开 + 一圈扁扁的涟漪 */
#fall .sp{position:absolute;left:0;top:0;will-change:transform,opacity;border-radius:50%;background:rgba(45,105,170,.8)}
#fall .sr{position:absolute;left:0;top:0;will-change:transform,opacity;border-radius:50%;border:1.4px solid rgba(45,105,170,.6);border-top-color:rgba(45,105,170,.2)}
/* 放大镜：只放在 💧 下面那个圆肚子里（圆心在 viewBox (0,3)、半径 9），里面是同一张谱的克隆，
   viewBox 每帧对准水珠正下方那一小块、缩小视野 = 放大 */
#fall .gd .lens{position:absolute;left:5%;top:37.9%;width:90%;height:62.1%;border-radius:50%;overflow:hidden;opacity:0;transition:opacity .25s}
#fall .gd .lens.on{opacity:1}
#fall .gd .lens svg{position:absolute;inset:0;width:100%;height:100%;transform:none;filter:none;overflow:hidden}
/* 卡住时留下的小水点：小圆珠，凸透镜画法（上沿暗、下沿亮、左上高光） */
#fall .gb{position:absolute;left:0;top:0;will-change:opacity;border-radius:50%;
  background:radial-gradient(ellipse at 50% 78%,rgba(255,255,255,.75),rgba(255,255,255,0) 52%),
             radial-gradient(circle at 33% 27%,#fff 0 13%,rgba(255,255,255,0) 25%),rgba(160,205,230,.22);
  box-shadow:inset 0 1.2px 1.8px rgba(8,55,90,.42),inset 0 -1px 1.2px rgba(255,255,255,.9),0 1px 1.5px rgba(8,45,75,.3)}
/* 谱面配色（只对矢量谱）：顶栏最右侧齿轮 + 面板，和数字谱单页同一套 8 色、同一份 score_* 存档 */
#bar{position:relative}
/* 齿轮：用户嫌原来「圆圈里一个小 ⚙ 字符」太小看不清 → 去掉圆圈，换成 24px 的 SVG 齿轮，点击区保持 36px */
#scGear{flex:0 0 auto;width:36px;height:36px;border:0;background:none;color:var(--ink);padding:0;
     cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
#scGear svg{width:24px;height:24px;display:block;pointer-events:none;transition:transform .3s}
#scGear[hidden]{display:none}
#scGear:hover,#scGear[aria-expanded="true"]{color:var(--accent)}
#scGear:hover svg{transform:rotate(30deg)}
#scGear:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#scPanel{position:absolute;top:calc(100% + 6px);right:10px;z-index:20;
     max-height:calc(100dvh - 90px);overflow-y:auto;overscroll-behavior:contain;   /* 矮屏（手机横屏）面板自己滚，不把整页顶上去 */
    width:240px;max-width:calc(100% - 20px);
     background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;
     box-shadow:var(--shadow);font-family:var(--cjk)}
#scPanel[hidden]{display:none}
#scPanel h3{margin:0 0 10px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
#scPanel .scr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;
     font-size:12.5px;color:var(--ink)}
#scPanel input[type=color]{width:32px;height:22px;border:1px solid var(--line);border-radius:5px;padding:0;
     background:none;cursor:pointer}
#scPanel .scb{display:flex;gap:8px;margin-top:10px;position:sticky;bottom:-14px;margin-bottom:-14px;padding:10px 0 14px;
     background:var(--panel)}   /* 面板自己会滚：确定 / 关闭钉在底 / 顶，随时点得到 */
#scPanel .scx{position:sticky;top:-14px;margin:-14px -14px 4px;padding:8px 8px 0;background:var(--panel);z-index:1}
#scPanel .scx button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
     color:var(--muted);font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#scPanel .scx button:hover{color:var(--ink);border-color:var(--ink)}
#scPanel .scb button{flex:1;font:inherit;font-size:12.5px;padding:7px 0;border-radius:7px;cursor:pointer;
     border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#scPanel .scb button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#paper.vecp{background:var(--sc-bg,#fff)}
#scPanel h3.sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
/* 皮肤：四个季节，一点就把谱面 9 色 + 小球 + 卡拉 OK + 竖线一起换掉；之后各项照样能单独再调 */
#scPanel .skins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#scPanel .skins button{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel);cursor:pointer;
     border:1px solid var(--line);border-radius:9px;padding:4px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px}
#scPanel .skins button[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
#scPanel .skins .sw{position:relative;width:100%;height:30px;border-radius:6px;overflow:hidden;
     border:1px solid rgba(0,0,0,.08);pointer-events:none}
#scPanel .skins .sw i{position:absolute;left:5px;right:5px;height:1.5px}
#scPanel .skins .sw b{position:absolute;right:5px;top:4px;width:9px;height:9px;border-radius:50%}
#scPanel .skins .sw em{position:absolute;left:5px;top:3px;font:700 10px/1 var(--num);font-style:normal}
#scPanel .seg{display:flex;gap:2px;background:var(--rail);border-radius:8px;padding:2px;margin-bottom:9px}
#scPanel .seg label{flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 0;
     border-radius:6px;cursor:pointer}
#scPanel .seg input{position:absolute;opacity:0;pointer-events:none}
#scPanel .seg label:has(input:checked){background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#scPanel .scr.off,#scPanel .seg.off{opacity:.4;pointer-events:none}
#scPanel .seg.falls label{font-size:11.5px}
/* 图片谱：只有竖线这一组有意义，谱面配色/小球都藏起来 */
#scPanel.img .vonly{display:none}
#scPanel.img .lsec h3.sub{margin-top:0;padding-top:0;border-top:0}
#scPanel .scr button.lnk{font:inherit;font-size:11.5px;color:var(--muted);background:none;border:0;padding:0 4px;
     cursor:pointer;text-decoration:underline;text-underline-offset:2px}
#scPanel input[type=range]{width:110px;accent-color:var(--accent);margin:0;cursor:pointer}
#scPanel .scr output{font-family:var(--num);font-size:11.5px;color:var(--muted);min-width:52px;text-align:right}
/* 跟谱指示二选一：小球和竖线叠在一起会打架。useball 挂在 #wrapP 上 */
#wrapP.useball #cue,#wrapP.useball #line{display:none!important}
#wrapP:not(.useball) #ball,#wrapP:not(.useball) #trail{display:none!important}
#scPanel input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;margin:0}
/* 跳动的小球：在六线谱的音头（×/品位）之间按拍子抛物线弹跳，落地挤一下、漾一圈 */
#ball{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;pointer-events:none;
     z-index:5;display:none;will-change:transform;transform-origin:50% 100%;
     --bc:var(--ball,#f5891f);
     background:radial-gradient(circle at 34% 30%,#fff 0,color-mix(in srgb,var(--bc) 45%,#fff) 22%,
                var(--bc) 58%,color-mix(in srgb,var(--bc) 72%,#000) 100%);
     box-shadow:0 0 12px color-mix(in srgb,var(--bc) 70%,transparent),0 0 3px rgba(0,0,0,.3)}
/* 火球：照用户给的卡通火球参考图——扁平三层火焰（外红橙 / 中橙 / 内黄），
   每层几条火舌往后飘、尖头摆动；球本身换成黄芯橙边。
   走过的弯路：圆形残影「不好看」→ 一串火团「丑、笨重」→ 渐变彗星尾「不好看」 */
#ball.fire{background:radial-gradient(circle at 45% 55%,#fffef5 0,#fff1a6 28%,
                color-mix(in srgb,var(--bc) 35%,#ffc13a) 60%,color-mix(in srgb,var(--bc) 55%,#f2601a) 88%,
                color-mix(in srgb,var(--bc) 45%,#d8330e) 100%);
     box-shadow:0 0 8px 2px color-mix(in srgb,var(--bc) 50%,#ffb02e)}
#trail path{stroke:none}
/* 冰球：白芯 → 冰蓝 → 深蓝边，左上一点高光，外面一圈冷光 */
#ball.ice{background:radial-gradient(circle at 34% 28%,#ffffff 0,#f4fbff 14%,#cdeeff 38%,#86c9ef 70%,#3d8fc6 100%);
     box-shadow:0 0 9px 2px rgba(150,212,255,.75),inset -2px -3px 5px rgba(25,80,140,.35)}
#trail{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:5;display:none}
/* 落地水花：一池 💧 水珠轮流用。形状 = 方块圆掉三个角，剩下左上那个尖角；
   每颗的抛射量 --dx/--dh/--df 和三段朝向 --r0/--r1/--r2 由 JS 给 ——
   尖头始终指向来的方向（飞出时朝落点、顶点时朝后、下落时朝上），读起来才像被溅起来的水滴 */
.drop{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:0 50% 50% 50%;
     pointer-events:none;z-index:5;opacity:0;will-change:transform,opacity;
     background:radial-gradient(circle at 62% 62%,#fff 0,color-mix(in srgb,var(--ball,#f5891f) 50%,#fff) 22%,
                var(--ball,#f5891f) 62%,color-mix(in srgb,var(--ball,#f5891f) 80%,#000) 100%)}
.drop.on{animation:drop var(--dd,.5s) cubic-bezier(.25,.6,.45,1) forwards}
@keyframes drop{
  0%  {opacity:.95;transform:translate3d(var(--x0),var(--y0),0) rotate(var(--r0)) scale(var(--ds))}
  45% {opacity:.9; transform:translate3d(calc(var(--x0) + var(--dx)*.6),calc(var(--y0) - var(--dh)),0) rotate(var(--r1)) scale(var(--ds))}
  100%{opacity:0;  transform:translate3d(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--df)),0) rotate(var(--r2)) scale(calc(var(--ds)*.5))}}
#wrapP:not(.useball) .drop,#wrapP:not(.useball) #boom{display:none!important}
/* 谱终爆炸：一团闪光 + 一圈火花（复用 💧 形状，尖头朝中心），然后什么都不留 */
#boom{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
     pointer-events:none;z-index:6;opacity:0;will-change:transform,opacity;
     background:radial-gradient(circle,#fff 0,color-mix(in srgb,var(--ball,#f5891f) 35%,#fff3b0) 24%,
                color-mix(in srgb,var(--ball,#f5891f) 75%,transparent) 48%,transparent 70%)}
#boom.on{animation:boom .6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes boom{
  0%  {opacity:1;transform:translate3d(var(--bx),var(--by),0) scale(calc(var(--bs)*.3))}
  100%{opacity:0;transform:translate3d(var(--bx),var(--by),0) scale(calc(var(--bs)*2.8))}}
.drop.spk{animation:spark var(--dd,.7s) cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{
  0%  {opacity:1;  transform:translate3d(var(--x0),var(--y0),0) rotate(var(--r0)) scale(var(--ds))}
  60% {opacity:.9; transform:translate3d(calc(var(--x0) + var(--dx)*.8),calc(var(--y0) + var(--dy)*.8),0) rotate(var(--r0)) scale(var(--ds))}
  100%{opacity:0;  transform:translate3d(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--dy) + var(--g)),0) rotate(var(--r1)) scale(calc(var(--ds)*.3))}}
@keyframes bfx{
  from{opacity:.95;transform:translate3d(var(--fx,0),var(--fy,0),0) scale(calc(var(--fs,1)*.25))}
  to  {opacity:0;  transform:translate3d(var(--fx,0),var(--fy,0),0) scale(calc(var(--fs,1)*1.5))}}
#stage{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;cursor:pointer;
       -webkit-user-select:none;user-select:none}
#stage::-webkit-scrollbar{display:none}
#paper{position:relative;width:var(--pw,100%);max-width:1040px;margin:0 auto;background:var(--paper);
       box-shadow:var(--shadow);padding:0 14px 8px;
       display:flex;flex-wrap:wrap;align-items:flex-start;
       /* 行间留白，列间必须是 0 —— 同一行里相邻的半行要无缝接上 */
       column-gap:0;row-gap:18px;padding-top:12px}
/* 段落不再插文字到谱面中间——那会把一行音乐切断。
   改成谱条左缘一道竖条，零横向占位；段落名在底部读数里实时显示。 */
.prow.secstart::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
     background:var(--accent);border-radius:2px;z-index:4;pointer-events:none}
.prow{position:relative;flex:0 0 auto;width:var(--w)}
.ptitle{flex:0 0 100%;position:relative;background-repeat:no-repeat;margin-bottom:2px}
.ptxt{flex:0 0 100%;display:flex;align-items:baseline;gap:10px;padding:10px 2px 4px;
     border-bottom:1px solid var(--line);margin-bottom:4px}
.ptxt b{font-size:19px;font-weight:600;color:var(--ink)}
.ptxt span{font-family:var(--num);font-size:12px;color:var(--muted)}
.strip{position:relative;width:100%;background-repeat:no-repeat;max-width:100%}
/* 矢量页：谱条里直接放 <svg>，viewBox 裁出这一段，撑满谱条 */
.strip>svg.vec,.ptitle>svg.vec{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
/* 音头（× / 品位数字）按自己的外框中心缩放：受击回弹用 */
svg.vec [data-k]{transform-box:fill-box;transform-origin:50% 50%}
/* 卡拉 OK：唱到的字变色加粗，这一段弹过去就恢复（.ko 由 karaPaint 加减） */
/* 亮起那一下弹一弹（放大再回原大小），之后保持原字号——一直放大着用户说不好看。
   用 transform 以字自身中心缩放：不重排、只走合成，邻字不被挤动 */
svg.vec text.cf-lyric{transition:fill .12s;transform-box:fill-box;transform-origin:50% 50%}
svg.vec text.cf-lyric.ko{fill:var(--kara,#d9480f);font-weight:700;animation:kpop .3s ease-out}
@keyframes kpop{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){svg.vec text.cf-lyric.ko{animation:none}}
/* 结尾只要把「谱终」露出来就行，不再撑出一屏空白把末行顶到页顶。
   原来 padding-bottom:52vh 是为了让最后一行也能滚到屏幕上方，
   结果弹完最后一小节谱面还在往上爬，底下全是空的。
   follow() 本来就会把 want 夹在 scrollHeight-clientHeight 以内，
   把这截空白去掉，滚动自然停在「末行 + 谱终」都看得见的位置。 */
/* 谱尾：用户说「谱终两个字不需要，是人就知道谱终了」→ 换成版权信息。id 仍叫 eof（selftest 靠它判断滚到底） */
#eof{padding:22px 16px 26px;text-align:center;font-size:12px;line-height:1.7;letter-spacing:.04em;
     color:var(--muted);background:var(--ground)}
#eof b{font-weight:600;color:var(--ink);letter-spacing:.06em}
#stage.ribbon{overflow:hidden}
#stage.ribbon #paper{position:absolute;top:50%;left:0;width:auto;max-width:none;display:flex;
     flex-wrap:nowrap;row-gap:0;align-items:flex-start;padding:0;box-shadow:none;will-change:transform}
/* 不要用 border 做分隔线：那会占位，接缝处多 1px 就是 1px 的瞬跳。
   小节线改成绝对定位的伪元素画 —— 不占位，位置和高度都能精确控制。

   为什么必须自己画：原以为「右边留 3px 就能保住上一行结尾那根小节线」，
   但回源图一看，`bl[-1]` 其实是**谱表的右端收尾线**，简谱行那边根本没有
   对应的 `|`，有些行的行尾小节线还画在更靠左的地方。
   指望原图是靠不住的，两个小节就会连在一起。

   高度跟着谱表走（--s0/--s1 是谱表上下缘占谱条高的百分比），
   画出来和印刷的小节线一个样子。 */
#stage.ribbon .prow{flex:0 0 auto;position:relative}
/* 接缝处那根小节线，照着原图画：原图是**两段 1px 细线** ——
   一段正好跨谱表，一段在简谱行（各首的行距不同，所以在出谱时逐行量，
   存成 r.bs，见 scripts/add_barseg.py）。
   颜色写死深灰：谱面图片永远是浅底的，不能跟着主题变成浅色。 */
#stage.ribbon .prow+.prow::before,
#stage.ribbon .prow+.prow::after{
  content:"";position:absolute;z-index:2;left:0;width:var(--bw,1.4px);
  background:var(--seam,#2b2824);opacity:.9}
#paper.vecp{--seam:var(--sc-tab,#111)}
#stage.ribbon .prow+.prow::before{top:var(--b0t,30%);height:var(--b0h,40%)}
#stage.ribbon .prow+.prow::after {top:var(--b1t,0%);height:var(--b1h,0%)}
#stage.ribbon .strip{width:auto;max-width:none}
#stage.ribbon #band,#stage.ribbon #cue{display:none!important}
#stage.ribbon #eof{display:none}
#line{position:absolute;top:0;bottom:0;left:33%;width:var(--lw,3px);margin-left:calc(var(--lw,3px)/-2);background:var(--cue);
      box-shadow:0 0 12px var(--cue-glow);z-index:4;pointer-events:none;display:none}
#stage.ribbon ~ #line{display:block}
#band{position:absolute;left:0;width:100%;background:var(--cue-soft);pointer-events:none;display:none;z-index:1}
#cue{position:absolute;left:0;top:0;width:var(--lw,3px);margin-left:calc(var(--lw,3px)/-2);background:var(--cue);border-radius:2px;
     box-shadow:0 0 9px var(--cue-glow);pointer-events:none;display:none;z-index:3;
     will-change:transform}
#cue::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
     border:5px solid transparent;border-top:8px solid var(--cue)}
/* 跳转预告：整页模式下反复要往回跳，提前约一小节在目标位置闪一个箭头 */
#jump{position:absolute;width:3px;margin-left:-1.5px;background:var(--cue);border-radius:2px;
     z-index:5;pointer-events:none;display:none;box-shadow:0 0 10px var(--cue-glow);
     animation:jb .55s steps(1,end) infinite}
#jump::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
     border:9px solid transparent;border-top:14px solid var(--cue)}
/* 目标常常滚出屏幕，所以同时在游标旁边贴一个提示——眼睛正看着那儿 */
#jwarn{position:absolute;z-index:6;pointer-events:none;display:none;transform:translateX(-50%);
     background:var(--cue);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;
     padding:3px 10px;border-radius:999px;box-shadow:0 3px 12px var(--cue-glow);
     animation:jb .55s steps(1,end) infinite}
#jwarn::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
     border:5px solid transparent;border-top:7px solid var(--cue)}
@keyframes jb{0%,49%{opacity:1}50%,100%{opacity:.12}}
@media (prefers-reduced-motion:reduce){#jump{animation:none;opacity:1}}
#dock{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:10px 14px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);
      border-top:1px solid var(--line);z-index:5;transition:opacity .35s}
/* 播放 3 秒后把顶栏推上去、底栏推下去，整屏让给谱面；点谱面暂停时推回来。
   用**负 margin**，不用 height:0 ——
   height 收缩是把盒子压扁，内容钉在原位被裁掉，看着像「挤扁」；
   负 margin 是盒子连内容一起平移出屏幕，看着才是「推出去」，
   而且同样把空间让出来（#stage 是 flex:1，会实实在在变高，不是盖一层上去）。
   位移量用 JS 量出来写进 --barH / --dockH，写死像素在不同机型上会露边。 */
#app{overflow:hidden}
/* 1 秒，先慢后快带点弹性。时长写成变量，JS 那边的重算延时和滚动守卫都按它算，
   改一个地方就够，不会出现「动画还在走、守卫已经撤了」。

   收和放用两条不同的缓动 —— CSS 取的是**目标状态**上的 transition：
     放下（回到基态）  easeOutBack：冲进来，略微过头，再回弹坐稳
     收起（进 .lean）  easeInBack ：先朝反方向压一点点（蓄力），再加速推出去
   这个 back 曲线的控制点超出 0~1，所以 margin 会短暂越过终点，
   弹性就是这么来的；越过的幅度只有几像素，不会露馅。 */
#bar,#dock{transition:margin var(--leanT,1s) cubic-bezier(.34,1.56,.64,1)}
#app.lean #bar,#app.lean #dock{transition-timing-function:cubic-bezier(.36,0,.66,-.56)}
#app.lean #bar{margin-top:calc(-1 * var(--barH,46px));pointer-events:none}
#app.lean #dock{margin-bottom:calc(-1 * var(--dockH,120px));pointer-events:none}
@media (prefers-reduced-motion:reduce){ #bar,#dock{transition:none} }
#seek{position:relative;height:20px;cursor:pointer;touch-action:none}
#seek::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--rail)}
#fill{position:absolute;left:0;top:8px;height:4px;border-radius:2px;background:var(--accent);width:0}
#knob{position:absolute;top:2px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--cue);
      box-shadow:0 0 8px var(--cue-glow)}
.tk{position:absolute;top:7px;width:1px;height:6px;background:var(--line)}
.tk.hd{top:3px;height:14px;width:2px;background:var(--accent);opacity:.5}
#ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:9px 12px}
#play{appearance:none;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);
      width:52px;height:38px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}
#readout{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--muted);
         white-space:nowrap;display:flex;align-items:baseline;gap:8px;flex:1 1 auto}
#readout b{color:var(--ink);font-size:17px;font-weight:700}
#beat{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--accent)}
#where{font-family:var(--cjk);font-size:12px;font-weight:500;color:var(--cue)}
#spdwrap{position:relative;flex:0 0 auto}
#spdpop{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);z-index:9;width:96px;
        background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
        padding:11px 9px 9px;display:flex;flex-direction:column;align-items:center;gap:6px}
#spdpop .hd{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1;color:var(--ink)}
#spdpop .unit{font-size:11px;color:var(--muted);margin-top:-3px}
#spdpop .sub{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}
#spdpop .pv{font-family:var(--num);font-size:11px;font-weight:700;color:var(--muted)}
#spdpop .sl{position:relative;height:156px;width:44px}
/* BPM 滑块：自绘。原生的是个小圆点，手指/鼠标都不好抓（用户要方形）。
   整条是转了 -90° 的横向 range，所以「宽」= 竖直方向的长度。滑块 30×22（转过来是 30 宽、22 高）的圆角方块，
   中间三道横纹当握把；轨道 8px，走过的部分用主题色填（--p 由 setBpm 写） */
#spdpop input[type=range]{position:absolute;left:50%;top:50%;width:150px;height:34px;margin:0;padding:0;
      -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none;
      transform:translate(-50%,-50%) rotate(-90deg)}
#spdpop input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;
      background:linear-gradient(90deg,var(--accent) var(--p,25%),var(--rail) var(--p,25%))}
#spdpop input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--rail)}
#spdpop input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
#spdpop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:30px;margin-top:-11px;
      border-radius:6px;border:1px solid color-mix(in srgb,var(--accent) 70%,#000);
      background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.55) 6px 7.5px) 4px 7px/14px 16px no-repeat,var(--accent);
      box-shadow:0 1px 4px rgba(0,0,0,.28)}
#spdpop input[type=range]::-moz-range-thumb{width:22px;height:30px;border-radius:6px;box-sizing:border-box;
      border:1px solid color-mix(in srgb,var(--accent) 70%,#000);
      background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.55) 6px 7.5px) 4px 7px/14px 16px no-repeat,var(--accent);
      box-shadow:0 1px 4px rgba(0,0,0,.28)}
#spdpop input[type=range]:focus-visible{outline:none}
#spdpop input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
#count{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;background:var(--scrim)}
#count span{font-family:var(--num);font-size:clamp(72px,22vw,170px);font-weight:700;color:var(--accent);
            font-variant-numeric:tabular-nums;line-height:1}
#flash{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:7;pointer-events:none;background:var(--cue);
       color:#fff;font-size:13px;font-weight:600;padding:7px 15px;border-radius:999px;opacity:0;transition:opacity .25s}
#flash.on{opacity:1}
@media (max-width:470px){ #dock{gap:8px 9px;padding-inline:10px} .sec{padding-inline:10px} }
@media (prefers-reduced-motion:reduce){ #dock,#flash{transition:none} }

<script>
(function(){
const $=i=>document.getElementById(i);
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const blobUrl=id=> window.__BLOB ? window.__BLOB(id) : '/_blob/'+id;
/* 矢量页（数字谱出的 SVG）：不当背景图贴，而是把 <svg> 真正插进谱条，
   用 viewBox 裁出这一段。谱面是活的 DOM —— 以后的动效（小球在六线谱的
   ×上跳、音符高亮、配色）都直接作用在谱面元素上。
   图片谱照旧走 backgroundImage，两条路并存。 */
const VEC={};
function vecPage(id){
  if(id in VEC) return VEC[id];
  let svg=null;
  const u=blobUrl(id), m=/^data:image\/svg\+xml(;base64)?,/.exec(u);
  if(m){
    const raw=u.slice(m[0].length);
    const txt=m[1] ? new TextDecoder().decode(Uint8Array.from(atob(raw),c=>c.charCodeAt(0)))
                   : decodeURIComponent(raw);
    const doc=new DOMParser().parseFromString(txt,'image/svg+xml');
    svg=doc.documentElement.nodeName==='svg' ? doc.documentElement : null;
    if(svg){
      /* 谱面配色表（cf-、cs- 开头的类，走 --sc- 变量）只挂一份到 <head>，每条谱不重复带 */
      svg.querySelectorAll('style').forEach((st,k)=>{
        if(!document.getElementById('vecCss'+id+k)){
          const c=document.createElement('style'); c.id='vecCss'+id+k; c.textContent=st.textContent;
          document.head.appendChild(c); }
        st.remove(); });
    }
  }
  return VEC[id]=svg;
}
function vecView(pg,x,y,w,h){
  const src=vecPage(pg.a); if(!src) return null;
  const v=document.importNode(src,true);
  v.setAttribute('viewBox',x+' '+y+' '+w+' '+h);
  v.setAttribute('preserveAspectRatio','none');
  v.removeAttribute('width'); v.removeAttribute('height');
  v.classList.add('vec');
  return v;
}

/* 每种拍号：[一小节几个单位, 几个单位算一个主拍]
   4/4 单位=四分音符，主拍就是它；6/8 单位=八分音符，3 个才算一个主拍（附点四分） */
const SIGS={'4/4':[4,1],'3/4':[3,1],'2/4':[2,1],'2/2':[2,1],
            '6/8':[6,3],'9/8':[9,3],'12/8':[12,3],'3/8':[3,3]};
const sigOf=s=>SIGS[(s&&s.sig)||'4/4']||SIGS['4/4'];
const sigSet=s=>!!(s&&s.sig);

/* ================= 能力 ================= */
let DB=null, AS=null, DL=null, ready=false;
async function boot(){
  try{ DB = (await window.claude?.use?.('db')) || null; }catch(e){}
  try{ AS = (await window.claude?.use?.('assets')) || null; }catch(e){}
  try{ DL = (await window.claude?.use?.('downloads')) || null; }catch(e){}
  ready=true;
  if(!DB || !AS){
    $('warn').hidden=false;
    $('warn').textContent = !AS
      ? '这个视图不能上传图片（需要编辑权限）。你仍然可以打开已有曲目演奏。'
      : '这个视图连不上存储，改动不会保存。';
  }
  await loadLib();
  if(window.__BOOT){                      /* 单曲离线包：直接打开演奏 */
    /* 一首一页之后，页签没有意义了：「曲库」点开只会列出它自己这一首。
       整包多曲的离线版（make_bundle.py）没有 __BOOT，页签照常保留。
       回目录靠左上角的「← 曲库」，那个只在目录页跳进来时（?lib=1）才出现。 */
    const tb=document.querySelector('#bar .tabs');
    if(tb) tb.hidden=true;
    const s=LIB.find(x=>x.id===window.__BOOT);
    if(s){ open_(s); show('play'); }
    else {                                /* 绝不留一片空白给用户 */
      const wv=$('warn'); wv.hidden=false; wv.className='';
      wv.textContent='这份单曲文件里的谱子数据没能载入——文件可能不完整。'
        +'需要重新生成一份。';
    }
  }
}

/* ================= 数据 ================= */
let LIB=[], LIB0=[], S=null;          /* S = 当前曲目，LIB0 = 没排过的原始顺序 */

/* ================= 曲目顺序 =================
   纯静态页面没有后端，跨终端只能这么办，三层叠起来用：
     1. localStorage —— 本机立刻生效，file:// 也能用，但只认这一台设备这一个浏览器。
     2. order.json  —— 和页面放同一个目录，走 http(s) 时开页就拉。
        推一个几百字节的 json 到仓库，所有设备下次打开就同步了，不用重新生成 6MB 的 HTML。
     3. 顺序码      —— 一串可以复制粘贴的文本，用来手动把顺序带到另一台设备（离线也行）。
   谁新用谁（比 ts），本机改动永远立刻生效，不会被云端悄悄盖掉。*/
const OKEY='gs2.order';
let ORD=null, ORDTS=0, ordNote=false;

const sid6 = id => String(id||'').replace(/^sg-/,'').slice(0,6);

function ordRead(){
  try{ const o=JSON.parse(localStorage.getItem(OKEY)||'null');
       if(o && Array.isArray(o.ids)){ ORD=o.ids; ORDTS=o.ts||0; } }catch(e){}
}
function ordWrite(){
  ORDTS=Date.now();
  try{ localStorage.setItem(OKEY, JSON.stringify({v:1, ts:ORDTS, ids:ORD})); }catch(e){}
}
/* 顺序码：每首取 id 的前 6 位十六进制，拼起来。31 首≈186 个字符，够短，能一条消息发走。 */
function ordCode(){ return 'GS1' + (ORD||LIB0.map(x=>x.id)).map(sid6).join(''); }
function ordFromCode(code){
  code=String(code||'').trim().replace(/\s+/g,'');
  if(!/^GS1[0-9a-f]+$/i.test(code) || (code.length-3)%6) return null;
  const want=code.slice(3).toLowerCase().match(/.{6}/g)||[];
  const by={}; LIB0.forEach(x=>{ by[sid6(x.id)]=x.id; });
  const ids=want.map(k=>by[k]).filter(Boolean);
  return ids.length ? ids : null;
}
/* order.json 形如 {"v":1,"ts":1730000000000,"ids":["sg-...","sg-..."]} */
async function ordFetch(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const r=await fetch('order.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const o=await r.json();
    if(!o || !Array.isArray(o.ids)) return;
    /* 钳住未来时间：order.json 里写了个未来的 ts（手抖或时钟歪了）会永远压过本机，
       用户在这台设备上调的顺序一刷新就被悄悄吃掉。 */
    const rt=Math.min(Number(o.ts)||0, Date.now());
    if(rt <= ORDTS) return;
    ORD=o.ids; ORDTS=rt; ordWrite();
    ordNote=true;                      /* 不要悄悄换，渲染时提示一行 */
  }catch(e){}
}
/* 把 LIB0 按 ORD 排。ORD 里没有的（新加的曲子）按原顺序排在后面，不会丢。 */
function applyOrd(){
  if(!ORD || !ORD.length){ LIB=LIB0.slice(); return; }
  const pos={}; ORD.forEach((id,i)=>{ pos[id]=i; });
  const known=[], rest=[];
  LIB0.forEach(x=> (pos[x.id]!=null ? known : rest).push(x));
  known.sort((a,b)=>pos[a.id]-pos[b.id]);
  LIB=known.concat(rest);
}
function moveSong(id, dir){
  const i=LIB.findIndex(x=>x.id===id), j=i+dir;
  if(i<0 || j<0 || j>=LIB.length) return;
  const t=LIB[i]; LIB[i]=LIB[j]; LIB[j]=t;
  ORD=LIB.map(x=>x.id); ordWrite(); ordNote=false; renderLib();
}
const blank=()=>({title:'未命名', key:'1 = C', sig:null, bpm:68, pages:[], rows:[], seq:[]});

async function loadLib(){
  LIB0=[];
  if(DB){
    try{
      const q=await DB.collection('songs').get();
      LIB0=q.docs.map(d=>Object.assign({id:d.id}, d.data()));
    }catch(e){ console.warn(e); }
  }
  ordRead();
  const h=(location.hash||'').match(/[#&]o=(GS1[0-9a-f]+)/i);   /* 链接里带顺序码也认 */
  if(h){ const ids=ordFromCode(h[1]); if(ids){ ORD=ids; ordWrite(); } }
  applyOrd(); renderLib();
  ordFetch().then(()=>{ applyOrd(); renderLib(); });
}
let saveT=0;
function save(now){
  if(!DB||!S) return;
  clearTimeout(saveT);
  const go=async()=>{ try{
      const {id,...body}=S; await DB.collection('songs').doc(id).set(body);
    }catch(e){ console.warn('save',e); } };
  now? go() : saveT=setTimeout(go, 700);
}

/* ================= 曲库 ================= */
function renderLib(){
  const L=$('libList'); L.textContent='';
  const kw=($('q').value||'').trim().toLowerCase();
  const list = kw ? LIB.filter(x=>(x.title||'').toLowerCase().includes(kw)) : LIB;
  const hd=el('div','libhd');
  hd.appendChild(el('b',null,'曲目'));
  hd.appendChild(el('span',null, kw ? list.length+' / '+LIB.length+' 首'
                                    : '共 '+LIB.length+' 首'));
  hd.appendChild(el('span','sp',''));
  const bCode=el('button','sm cjk','顺序码');
  bCode.title='把当前顺序导出成一段文本，或粘贴别处来的顺序';
  bCode.onclick=ordDialog;
  hd.appendChild(bCode);
  if(ORD && ORD.length){
    const bRst=el('button','sm warn cjk','默认顺序');
    bRst.onclick=()=>{ if(!confirm('恢复成文件自带的顺序？')) return;
      ORD=null; try{ localStorage.removeItem(OKEY); }catch(e){} ORDTS=0;
      applyOrd(); renderLib(); };
    hd.appendChild(bRst);
  }
  L.appendChild(hd);
  if(ordNote){
    const t=el('div','ordtip');
    t.innerHTML='曲目顺序已按 <b>order.json</b> 更新。在这里调一下 ▲▼ 就会以本机为准。';
    L.appendChild(t);
  }
  if(kw){
    const t=el('div','ordtip');
    t.innerHTML='搜索时不能调顺序——<b>清空搜索框</b>再用 ▲▼。';
    L.appendChild(t);
  }
  if(!list.length){
    const e=el('div','empty');
    e.textContent = kw ? '没有叫「'+$('q').value.trim()+'」的曲子。' : '这个文件里还没有曲目。';
    L.appendChild(e); return;
  }
  /* 序号按曲库当前顺序给，搜索时不重排，方便和完整列表对上号 */
  list.forEach(s=>{
    const i=LIB.indexOf(s);
    const c=el('div','card');
    c.appendChild(el('span','no',String(i+1)));
    c.appendChild(el('b','nm',s.title||'未命名'));
    const mv=el('div','mv');
    const up=el('button',null,'▲'), dn=el('button',null,'▼');
    up.type=dn.type='button';
    up.setAttribute('aria-label','上移'); dn.setAttribute('aria-label','下移');
    up.disabled = !!kw || i<=0;
    dn.disabled = !!kw || i>=LIB.length-1;
    up.onclick=e=>{ e.stopPropagation(); moveSong(s.id,-1); };
    dn.onclick=e=>{ e.stopPropagation(); moveSong(s.id, 1); };
    mv.append(up,dn); c.appendChild(mv);
    const b=el('button','sm go cjk','演奏');
    b.onclick=e=>{ e.stopPropagation(); open_(s); show('play'); };
    c.appendChild(b);
    c.onclick=()=>{ open_(s); show('play'); };
    L.appendChild(c);
  });
}

/* 顺序码：导出一段能复制走的文本，或粘一段进来。
   跨设备没有后端可用，这是唯一离线也成立的办法。 */
function ordDialog(){
  const code=ordCode();
  const paste=prompt(
    '当前顺序码（复制走，在别的设备上再粘回来）：\n\n'+code+
    '\n\n要应用别处来的顺序，就把那串码粘在这里再按确定；直接按取消则什么都不做。',
    code);
  if(paste==null) return;
  if(paste.trim()===code) return;
  const ids=ordFromCode(paste);
  if(!ids){ alert('这串码不对，或者里面的曲子这个文件里没有。'); return; }
  ORD=ids; ordWrite(); applyOrd(); renderLib();
  alert('顺序已套用（'+ids.length+' 首）。');
}
function open_(s){ S=s;
  /* 顶栏只放歌名。拍号底部那排已经有了（「♩4/4」），顶上再挂一个是重复。 */
  $('songname').textContent=s.title||'';
}

/* ================= 视图切换 ================= */
function show(v){
  $('libView').hidden = v!=='lib';
  $('playView').hidden= v!=='play';
  $('tabLib').setAttribute('aria-selected',String(v==='lib'));
  $('tabPlay').setAttribute('aria-selected',String(v==='play'));
  if(v==='lib'){ renderLib(); $('songname').textContent=''; }
  if(v==='play'){ buildPlay(); }
  if(v==='lib'){ $('scPanel').hidden=true; $('scGear').hidden=true; }   /* 齿轮只在演奏页 */
  else P.stop();
}
$('tabLib').onclick =()=>show('lib');
$('q').oninput=()=>renderLib();
$('tabPlay').onclick=()=>{ if(S) show('play'); };

/* ================= 氛围飘落 =================
   用户：「冬天满屏飘雪花，时不时有雪花飘下来；秋天时不时有黄叶飘下来；春天花瓣；夏天飘雨点」。
   「时不时」= 稀疏、不间断地来：每种一个随机间隔的生成器 + 同屏上限。只有数字谱、演奏页可见、
   页面在前台时才生成；减少动态效果时整个关掉。每片用 element.animate() 一次性飘完，结束回收。 */
const FALL=(()=>{
  const box=$('fall'), pool=[]; let kind='none', tm=0, alive=0;
  const R=(a,b)=>a+Math.random()*(b-a);
  const SNOWF='<svg viewBox="-10 -10 20 20"><g stroke="#fff" stroke-width="1.8" stroke-linecap="round" style="filter:drop-shadow(0 0 1.2px rgba(45,90,145,.85))">'
    +[0,60,120].map(a=>'<g transform="rotate('+a+')"><path d="M0-9V9M-2.6-6.4L0-4 2.6-6.4M-2.6 6.4L0 4 2.6 6.4"/></g>').join('')+'</g></svg>';
  const PETAL=c=>'<svg viewBox="-10 -12 20 24"><path d="M0 11C-8 5-9-3-4-9c2-2 3-1 4 1 1-2 2-3 4-1 5 6 4 14-4 20z" fill="'+c+'" stroke="rgba(190,60,100,.35)" stroke-width=".6"/>'
    +'<path d="M0 9C-1 3-1-2 0-6" stroke="rgba(255,255,255,.6)" stroke-width=".8" fill="none"/></svg>';
  const LEAF=(c,v)=>'<svg viewBox="-12 -14 24 28"><path d="M0 13C-10 6-11-4-2-13 0-11 0-11 2-13 11-4 10 6 0 13z" fill="'+c+'"/>'
    +'<path d="M0 13V-11M0 2L-5-3M0-3L5-7M0 7L5 3M0-7L-4-10" stroke="'+v+'" stroke-width=".9" fill="none" stroke-linecap="round"/></svg>';
  const CFG={
    snow:{gap:[160,420], max:46, make(e){ const flake=Math.random()<0.4, z=flake?R(11,18):R(4.5,9);
            e.style.width=e.style.height=z+'px';
            e.innerHTML=flake?SNOWF:'';
            e.style.background=flake?'':'radial-gradient(circle,#fff 0,#fff 45%,rgba(255,255,255,0) 72%)';
            e.style.borderRadius='50%'; e.style.filter=flake?'':'drop-shadow(0 0 1.5px rgba(50,95,150,.75))';   /* 白雪落在浅底上，靠一圈冷灰蓝的晕勾出来 */
            return {dur:R(8000,14000), sway:R(18,60), spin:R(-180,180), drift:R(-30,30), tilt:false}; }},
    petal:{gap:[700,1700], max:14, make(e){ const z=R(10,17), c=['#f8b9cf','#f49ab9','#fcd3e1','#f7a8c4'][Math.random()*4|0];
            e.style.width=z+'px'; e.style.height=z*1.2+'px'; e.innerHTML=PETAL(c); e.style.background=''; e.style.filter='';
            return {dur:R(7000,11000), sway:R(40,110), spin:R(240,720)*(Math.random()<.5?-1:1), drift:R(20,120), tilt:true}; }},
    leaf:{gap:[1100,2600], max:10, make(e){ const z=R(15,24), k=Math.random()*4|0,
              c=['#e8b52a','#f0c33c','#d9822b','#c9642a'][k], v=['#b8871a','#c09520','#a85f1c','#94461b'][k];
            e.style.width=z+'px'; e.style.height=z*1.15+'px'; e.innerHTML=LEAF(c,v); e.style.background=''; e.style.filter='';
            return {dur:R(6500,10000), sway:R(50,130), spin:R(180,540)*(Math.random()<.5?-1:1), drift:R(-60,80), tilt:true}; }},
    rain:{gap:[45,130], max:36, make(e){ const L=R(20,34);
            e.style.width='2px'; e.style.height=L+'px'; e.innerHTML=''; e.style.filter=''; e.style.borderRadius='1px';
            e.style.background='linear-gradient(rgba(60,120,180,0),rgba(45,105,170,.75))';
            return {dur:R(650,1000), sway:0, spin:0, drift:-R(60,110), tilt:false, rain:L}; }} };
  /* 雨点落地：「地面」就是飘落层的下沿——底部功能栏弹出时它正好贴着功能栏上边缘，
     功能栏收起（#app.lean）时飘落层撑到屏幕底，地面跟着变成屏幕底边，不用另外判断 */
  /* 实测：功能栏收起后飘落层比屏幕底边还长出 32px，所以地面 = 飘落层下沿和屏幕底边里靠上的那个 */
  const ground=()=>Math.min(box.clientHeight, innerHeight-box.getBoundingClientRect().top);
  function splash(x, g){
    if(Math.random()<0.35) return;
    const n=2+(Math.random()*3|0);
    for(let i=0;i<n;i++){ const z=R(2,3.6), e=el('span','fp sp'); e.style.width=e.style.height=z+'px'; box.appendChild(e);
      const dx=R(-20,20), dy=R(9,24), du=R(340,560);
      const an=e.animate([{transform:`translate(${x}px,${g-z}px)`,opacity:.95},
                          {transform:`translate(${(x+dx*0.55).toFixed(1)}px,${(g-z-dy).toFixed(1)}px)`,opacity:.9,offset:.45,easing:'ease-in'},
                          {transform:`translate(${(x+dx).toFixed(1)}px,${g-z}px)`,opacity:0}],{duration:du,easing:'ease-out'});
      an.onfinish=an.oncancel=()=>e.remove(); }
    const r=el('span','fp sr'), w=R(14,24); r.style.width=w+'px'; r.style.height=w*0.28+'px'; box.appendChild(r);
    const tr=`translate(${x-w/2}px,${g-w*0.2}px)`;
    const an=r.animate([{transform:tr+' scale(.25)',opacity:.9},{transform:tr+' scale(1.5)',opacity:0}],{duration:R(380,520),easing:'ease-out'});
    an.onfinish=an.oncancel=()=>r.remove();
  }
  function one(){
    const c=CFG[kind]; if(!c || alive>=c.max) return;
    const W=box.clientWidth, H=box.clientHeight; if(!W || !H) return;
    const e=pool.pop()||el('span','fp'); e.style.opacity='0'; box.appendChild(e); alive++;
    const o=c.make(e), x0=R(-40,W+20), y0=-30, y1=o.rain ? ground()-o.rain*0.92 : H+30;   /* 雨：下端正好落到地面 */
    let fr;
    if(o.rain){   /* 雨：斜着直直落下（drift 往左下的斜度），角度跟着斜 */
      const ang=Math.atan2(y1-y0, o.drift)*180/Math.PI-90;
      fr=[{transform:`translate(${x0}px,${y0}px) rotate(${ang}deg)`,opacity:0},
          {transform:`translate(${x0+o.drift*0.15}px,${y0+(y1-y0)*0.15}px) rotate(${ang}deg)`,opacity:1,offset:.15},
          {transform:`translate(${x0+o.drift}px,${y1}px) rotate(${ang}deg)`,opacity:1}];
    } else {      /* 飘：左右摆（正弦，取 7 个关键帧）、慢慢转；花瓣/叶子再加一个翻面（rotateY/X） */
      fr=[]; const ph=R(0,6.28);
      for(let i=0;i<=8;i++){ const u=i/8, sx=Math.sin(ph+u*Math.PI*2.2)*o.sway;
        fr.push({transform:`translate(${(x0+o.drift*u+sx).toFixed(1)}px,${(y0+(y1-y0)*u).toFixed(1)}px) rotate(${(o.spin*u).toFixed(0)}deg)`
                 +(o.tilt?` rotateY(${(Math.sin(ph+u*9)*65).toFixed(0)}deg) rotateX(${(Math.cos(ph+u*7)*45).toFixed(0)}deg)`:''),
                 opacity: i===0?0 : (i===8?0:(kind==='snow'?0.95:1))}); }
    }
    const an=e.animate(fr,{duration:o.dur,easing:'linear'});
    an.oncancel=()=>{ e.remove(); pool.push(e); alive--; };
    an.onfinish=()=>{ an.oncancel(); if(o.rain && kind==='rain') splash(x0+o.drift, ground()); };
  }
  /* 夏天额外一层：近处玻璃上的水珠。先凭空冒出来停一会儿，再「停-滑-停」地往下溜（粘滞-滑动，
     真水珠就是这么走的：攒够重量突然窜一截，碰到干处又卡住），身后在玻璃上留一道原地干掉的水痕，卡住的地方留下小水点 */
  let tg=0, gAlive=0;
  const gel=(c,x,y,w,h)=>{ const e=el('span',c); e.style.width=w+'px'; e.style.height=h+'px';
    e.style.transform=`translate(${x}px,${y}px)`; box.appendChild(e); return e; };
  const gone=(e,an,cb)=>{ an.onfinish=an.oncancel=()=>{ e.remove(); cb&&cb(); }; };
  /* 💧：上尖下圆。身子是几乎透明的水，边缘一圈深色折射，底部一道亮弧（聚光），左上一点高光 */
  const DROP='<svg viewBox="-10 -17 20 29"><defs><radialGradient id="wdB" cx=".45" cy=".62" r=".62">'
    +'<stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#bfe0f2" stop-opacity=".28"/>'
    +'<stop offset="1" stop-color="#2f78a8" stop-opacity=".5"/></radialGradient></defs>'
    +'<path d="M0-16C1.6-10.5 9-4.5 9 3A9 9 0 0 1-9 3C-9-4.5-1.6-10.5 0-16Z" fill="url(#wdB)" stroke="rgba(10,60,95,.4)" stroke-width=".7"/>'
    +'<path d="M-6.2 4.6A6.6 6.6 0 0 0 6.2 4.6" stroke="#fff" stroke-opacity=".85" stroke-width="1.5" fill="none" stroke-linecap="round"/>'
    +'<ellipse cx="-3.4" cy="-.8" rx="1.7" ry="3.1" fill="#fff" fill-opacity=".92" transform="rotate(18 -3.4 -.8)"/>'
    +'<circle cx="2.8" cy="-6.2" r=".8" fill="#fff" fill-opacity=".7"/></svg>';
  /* ---- 水珠放大镜 ----
     浏览器没有「放大背后内容」的滤镜，只能自己模拟：圆肚子里放一份谱面 SVG 的克隆，
     每帧读水珠在屏幕上的位置 → 换算到谱面坐标 → 把克隆的 viewBox 对准那里并缩小视野。
     谱面在播放中会滚动，所以只能逐帧跟，不能像水珠本身那样整段交给合成器。
     为了省：只给正在滑的大水珠加，同时最多 3 颗；克隆的 SVG 放进池子里反复用，不每次重建。
     全程先读后写（先把所有 getBoundingClientRect 读完再改 viewBox），避免读写交错导致强制重排。 */
  const MAG=1.6, LENS=new Set(), lpool=[]; let lraf=0, lvars='';
  function lensOn(d, z){

    const todo=[];
    LENS.forEach(L=>{ const r=L.w.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      const S=strips.find(q=>cx>=q.r.left && cx<=q.r.right && cy>=q.r.top && cy<=q.r.bottom);
      if(!S){ todo.push([L,null]); return; }

  function snap(cx, by, w, L, rot, dl, op){

                       {transform:tr+' scale(1.2,.1)',opacity:0}],{duration:du,delay:dl,easing:'ease-out'}));   /* 不能 fill:backwards：那样断开之前它就以不透明的样子提前挂在水珠前方（实测）*/
    const n=1+(Math.random()*3|0);

  }
  function drop(){
    const W=box.clientWidth, H=box.clientHeight; if(kind!=='rain' || !W || !H || gAlive>=7) return;   /* 夏天时排好的定时器，换季后不许再冒水珠 */

    const rz=Math.random(), z=rz<0.4 ? R(5,9) : rz<0.8 ? R(10,16) : R(18,30);
    const h=z*1.45, x=R(10,W-z-4), y=R(-10,H*0.55), slide=z>10.5 && Math.random()<0.85;
    const d=gel('fp gd',x,y,z,h); d.innerHTML=DROP;

    const tw=z*R(0.24,0.42), tl=z*R(2,3.6), rot=R(-5,5), brk=R(1.15,1.9), tail=el('i');
    tail.style.width=tw+'px'; tail.style.marginLeft=(-tw/2)+'px'; tail.style.height=tl+'px';

    const sv=d.firstChild, appear=R(300,500), sit=R(800,2600);

    const TF=(sy)=>`rotate(${rot.toFixed(1)}deg) scale(${Math.min(1,Math.max(0.45,1/Math.sqrt(Math.max(sy,0.01)))).toFixed(3)},${sy.toFixed(3)})`;
    const tk=[{transform:TF(0),offset:0},{transform:TF(0),offset:pre/tot}];
    let sy=0;
    pts.forEach(([tt,yv,xv,f],i)=>{ if(!i) return;

        tk.push({transform:TF(sy),offset:o});

  let playAt=null;
  if(metro&&acx){
    const t0=acx.currentTime+0.06;
    for(let u=0;u<units;u++){
      const main=(u%GRP)===0;
      if(main||subdiv) tickAt(t0+u*spu, u===0?2:(main?1:0));
      if(subdiv && GRP===1) tickAt(t0+u*spu+spu/2, 0);   /* 预备拍也要带上细分 */
    }
    playAt=t0+units*spu;        /* 正式第一拍 = 预备拍之后恰好一格，接得上 */
    anchor(playAt);             /* 立刻定下正式演奏的格子 */
    armed=true; startSched();   /* 让排程器现在就把第 1 拍排进队列，别等交接那一刻 */
  }
  const t0ms=performance.now()+60, total=units*spu*1000;
  cid=setInterval(()=>{
    const el=performance.now()-t0ms;
    if(el>=total){ clearInterval(cid); cid=0; count.hidden=true; P.go(playAt); return; }
    count.firstElementChild.textContent=Math.max(1, mains-Math.floor(el/(spu*GRP*1000)));
  },40);
}
function seek(u){ pos=Math.max(0,Math.min(TOT,u)); cur=-1; anchor(); paint(); follow(null); }
function rowTo(i){ i=Math.max(0,Math.min(PL.length-1,i)); seek(CUM[i]+1e-6); }
function prevRow(){ const a=at(pos); rowTo((a.b>1.2||a.i===0)?a.i:a.i-1); }
let tid=0, ltid=0, leanGuard=0;
const LEAN_MS=1000;      /* 和 CSS 的 --leanT 对齐 */
/* 收起/放下之后要重算一次版面：#stage 高度变了，跑马灯的居中和
   整页模式的滚动位置都得跟着走。等过渡结束再算，省得算在半路上。 */
/* 推移距离 = 各自的实际高度。安全区、字号、机型都会影响它，不能写死。 */
function measureChrome(){
  const r=document.documentElement.style;
  if(!$('app').classList.contains('lean')){
    r.setProperty('--barH', $('bar').offsetHeight+'px');
    r.setProperty('--dockH', $('dock').offsetHeight+'px');
  }
}
function lean(on){
  const app=$('app'); if(!app) return;
  if(on) measureChrome();
  if(app.classList.contains('lean')===!!on) return;
  app.classList.toggle('lean', !!on);
  /* 栏目一塌下去 #stage 变高，浏览器会自己调 scrollTop。
     那不是用户在滚，得先把「手动滚动=暂停」那条守卫按住，
     否则收起的瞬间就会被判成「已停住」自动暂停（实测收起后 20ms 就中招）。 */
  leanGuard=Date.now()+LEAN_MS+300;
  clearTimeout(ltid);
  ltid=setTimeout(()=>{ fit(); layout(); paint(); follow(null); }, LEAN_MS+60);
}
function idle(){ clearTimeout(tid);
  if(playing) tid=setTimeout(()=>lean(true), 3000); }
/* 播放中鼠标移到上沿 / 下沿（顶栏、控制条原本所在的那一截，再多 24px 感应），
   栏目就放下来，不用暂停；移开 3 秒后照常收起。只认鼠标/笔——触屏没有悬停。 */
let nearChrome=false;
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch' || $('playView').hidden) return;
  const r=getComputedStyle(document.documentElement);
  const top=(parseFloat(r.getPropertyValue('--barH'))||46)+24,
        bot=(parseFloat(r.getPropertyValue('--dockH'))||120)+24;
  const near = e.clientY<top || e.clientY>innerHeight-bot;
  if(near){ if(!nearChrome || $('app').classList.contains('lean')){ nearChrome=true; clearTimeout(tid); lean(false); } }
  else if(nearChrome){ nearChrome=false; idle(); }
},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{ if(nearChrome){ nearChrome=false; idle(); } });
function layout(){
  if(ribbon){
    if(!PL.length) return;
    /* 所有行用同一个缩放比例 k，谱面大小才一致。
       早先是「每行都压成同样的像素高度」，高的行被压扁、矮的行被放大，
       结果同一首歌里字一会儿大一会儿小。 */
    const avail=Math.max(150, Math.min(stage.clientHeight-18, 360));
    let maxBand=1;
    PL.forEach(m=>{ if(m.ch>maxBand) maxBand=m.ch; });
    const k=avail/maxBand;
    /* 再按谱表中心对齐，一条条谱读起来才是连着的 */
    const A=PL.map(m=>m.sc*k);
    const maxA=Math.max.apply(null,A);
    paper.style.setProperty('--bw', Math.max(1, k).toFixed(2)+'px');  /* 原图小节线 1px，跟着缩放走 */
    prows.forEach((r,i)=>{ const st=psts[i];
      const w=PL[i].cw*k, h=PL[i].ch*k;
      r.style.width=w+'px'; r.style.height=h+'px'; r.style.marginTop=(maxA-A[i])+'px';
      st.style.width=w+'px'; st.style.height=h+'px'; });
  } else {
    prows.forEach((r,i)=>{ r.style.width=r.style.height=r.style.marginTop='';
      psts[i].style.width=psts[i].style.height=''; });
    paper.style.transform='';
    /* 浏览器先把谱条流式排好，再按「落在同一行的那几条」对齐谱表中心。
       必须分两趟：加了 margin-top 之后 offsetTop 会变，不能边读边改。 */
    const tops=prows.map(r=>r.offsetTop);
    const lines={};
    tops.forEach((t,i)=>{ const k=Math.round(t/4)*4; (lines[k]=lines[k]||[]).push(i); });
    Object.keys(lines).forEach(k=>{
      const idx=lines[k];
      if(idx.length<2){ return; }
      const h=prows[idx[0]].offsetHeight / (PL[idx[0]].ch||1);   /* 当前缩放 */
      let maxA=0; const A=idx.map(i=>{
        const a=PL[i].sc * (prows[i].offsetHeight/(PL[i].ch||1));
        if(a>maxA) maxA=a; return a; });
      idx.forEach((i,j)=>{ prows[i].style.marginTop=(maxA-A[j])+'px'; });
    });
  }
}
function applyMode(){
  stage.classList.toggle('ribbon',ribbon);
  $('mode').setAttribute('aria-pressed',String(ribbon));
  $('mode').textContent = ribbon?'整页':'跑马灯';
  layout(); paint(); if(!ribbon) follow(null);
}
function setMode(on){
  ribbon=!!on; lss('ribbon',ribbon?'1':'0');
  const keep=pos; buildPlay(); seek(keep);   /* 两种排法的 DOM 不同，必须重建 */
}

$('play').onclick=e=>{ e.stopPropagation(); toggle(); };
$('prev').onclick=e=>{ e.stopPropagation(); prevRow(); };
$('next').onclick=e=>{ e.stopPropagation(); rowTo(at(pos).i+1); };
$('rst').onclick =e=>{ e.stopPropagation(); P.stop(); seek(0); };
$('met').onclick =e=>{ e.stopPropagation(); setMetro(!metro); };
function setSub(on){ subdiv=!!on; lss('subdiv',subdiv?'1':'0');
  $('sub').setAttribute('aria-pressed',String(subdiv)); if(!subdiv) hush();
  ballBuild(); if(PL.length) paint(); }   /* 小球跟着细分开关换跳法 */
$('sub').onclick =e=>{ e.stopPropagation(); setSub(!subdiv); };
$('mode').onclick=()=>setMode(!ribbon);
$('spd').onclick =e=>{ e.stopPropagation(); spdpop.hidden=!spdpop.hidden;
  $('spd').setAttribute('aria-expanded',String(!spdpop.hidden)); };
spdpop.onclick=e=>e.stopPropagation();
spv.oninput=()=>setBpm(+spv.value);
addEventListener('pointerdown',e=>{ if(!spdpop.hidden && !spdpop.contains(e.target) && e.target!==$('spd')){
  spdpop.hidden=true; $('spd').setAttribute('aria-expanded','false'); } },true);

let ct=0;
stage.onclick=e=>{
  if(!count.hidden) return;
  const now=Date.now();
  if(now-ct<320){ ct=0; pick(e.clientY); return; }
  ct=now; setTimeout(()=>{ if(ct && Date.now()-ct>=320){ ct=0; toggle(); } },330);
};
function pick(clientY){
  if(ribbon||!prows.length) return;
  const y=clientY-paper.getBoundingClientRect().top; let best=0;
  prows.forEach((r,i)=>{ if(y>=r.offsetTop) best=i; });
  const k=PL.findIndex(m=>m.row===best);
  rowTo(k<0?0:k); say('→ 第'+((k<0?0:k)+1)+'段');
}
stage.onscroll=()=>{ if(ribbon||drag) return;
  if(Date.now()<leanGuard){ written=stage.scrollTop; sy=stage.scrollTop; return; }
  if(playing && Math.abs(stage.scrollTop-written)>3){ P.stop(); say('已停住'); } };
function grab(e){ const b=sb.getBoundingClientRect();
  seek(Math.max(0,Math.min(1,(e.clientX-b.left)/b.width))*TOT); }
sb.addEventListener('pointerdown',e=>{ drag=true; e.preventDefault();
  try{ sb.setPointerCapture(e.pointerId); }catch(_){} grab(e); });
sb.addEventListener('pointermove',e=>{ if(drag) grab(e); });
['pointerup','pointercancel'].forEach(ev=>sb.addEventListener(ev,e=>{ drag=false;
  try{ sb.releasePointerCapture(e.pointerId); }catch(_){} }));

addEventListener('keydown',e=>{
  if($('playView').hidden) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.key!=='Escape') return;
  const k=e.key;
  if(k===' '||k==='Enter'||k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); toggle(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prevRow(); }
  else if(k==='ArrowDown'){ e.preventDefault(); rowTo(at(pos).i+1); }
  else if(k==='ArrowUp'){ e.preventDefault(); prevRow(); }
  else if(k==='['){ setBpm(bpm-2); } else if(k===']'){ setBpm(bpm+2); }
  else if(k==='m'||k==='M'){ setMetro(!metro); }
  else if(k==='s'||k==='S'){ setSub(!subdiv); }
  else if(k==='r'||k==='R'){ P.stop(); seek(0); }
  else if(k==='Escape'){ spdpop.hidden=true; }
});
/* 原来动一下鼠标就重置计时。现在的规矩是：开始播放 3 秒后收起，
   只有「点谱面暂停」才放回来，中途晃鼠标不该把它顶出来。 */
addEventListener('resize',()=>{ measureChrome(); fit(); layout(); paint(); if(!playing) follow(null); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && playing) wake(true); });

/* 自测钩子：整页逻辑包在 IIFE 里，外部拿不到内部状态，
   脚本化回归测试（scripts/selftest.py）就没法验证游标格子和滚动行为。
   只读暴露，不提供任何修改入口，对正常使用没有影响。 */
window.__GS = {
  get song(){ return S; },
  get play(){ return PL; },
  get total(){ return TOT; },
  get ribbon(){ return ribbon; },
  get ball(){ return BALL; },
  ballPx: k => BALL[k] && bpx(BALL[k]),
  seek: u => seek(u),
  at: u => at(u),
  get order(){ return (LIB||[]).map(x=>x.id); },
  ordCode: () => ordCode(),
  ordApply: c => { const ids=ordFromCode(c); if(!ids) return false;
                   ORD=ids; ordWrite(); applyOrd(); renderLib(); return true; },
  seek: u => { seek(u); },
  follow: () => follow(null)
};

/* 目录页跳过来的（?lib=1）：露出返回键，并且把「曲库」页签也改成回目录——
   单曲页里的「曲库」本来只会列出这一首，从目录过来时那个列表没有意义。 */
(function(){
  try{
    if(!/[?&]lib=1(&|$)/.test(location.search)) return;
    const b=$('back'); if(!b) return;
    b.hidden=false;
    $('tabLib').onclick=()=>{ location.href=b.getAttribute('href'); };
  }catch(e){}
})();

boot();
})();
</script>
</body></html>
